<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ULTRON: COLOSSAL AWAKENING VR - Quest Visual Optimized Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030509;
            font-family: 'Share Tech Mono', monospace;
            color: #00f3ff;
        }
        #game-container {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        canvas#game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .visor-overlay {
            background:
                radial-gradient(circle at center, transparent 58%, rgba(5, 8, 16, 0.85) 100%),
                repeating-linear-gradient(0deg, rgba(0, 243, 255, 0.022) 0px, rgba(0, 243, 255, 0.022) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            will-change: transform;
        }
        .visor-frame {
            border: 2px solid rgba(0, 243, 255, 0.2);
            box-shadow: inset 0 0 60px rgba(0, 243, 255, 0.08), inset 0 0 25px rgba(255, 69, 0, 0.12);
            border-radius: 36px;
        }
        .hud-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 16px rgba(0, 243, 255, 0.4);
        }
        .hud-glow-orange {
            text-shadow: 0 0 10px rgba(255, 85, 0, 0.95), 0 0 22px rgba(255, 30, 0, 0.6);
        }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .animate-warning {
            animation: pulse-fast 0.38s infinite;
        }
        .damage-flash {
            transition: opacity 0.15s ease-out;
        }
        /* El control XR oficial permanece como activador interno.
           En la portada el usuario pulsa ENTER para comenzar. */
        #VRButton { display: none !important; }
        body.game-active #menu-modal {
            display: none !important;
        }
        body.vr-active #hud {
            display: none !important;
        }
        #jetpack-password-overlay {
            position: fixed; inset: 0; z-index: 75;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,.84); font-family: 'Share Tech Mono', monospace;
        }
        #jetpack-password-overlay.active { display: flex; }
        body.vr-active #jetpack-password-overlay { display: none !important; }
        #jetpack-password-form {
            width: min(92vw, 430px); padding: 30px; text-align: center;
            background: #07121b; border: 2px solid #20c4cd; border-radius: 20px;
            box-shadow: 0 0 45px #03baca44;
            color: #c8f8fc;
        }
        #jetpack-password-input {
            width: 100%; text-align: center; margin: 18px 0; padding: 12px;
            background: #000; color: white; font: bold 28px monospace;
            letter-spacing: .5em; border: 1px solid #17bac6; border-radius: 12px;
        }
        #jetpack-password-form button {
            width: 100%; background: #008b91; color: #fff;
            padding: 13px; border-radius: 10px; font-weight: 700;
        }
    </style>

    <!-- Import Map para Three.js y WebXR -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="relative w-full h-full overflow-hidden">

    <!-- Contenedor WebGL / WebXR -->
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Flash de daño en pantalla -->
    <div id="damage-overlay" class="fixed inset-0 pointer-events-none opacity-0 damage-flash z-10"
         style="background: radial-gradient(circle, transparent 30%, rgba(255, 35, 0, 0.68) 100%);"></div>

    <!-- Flash de encendido del Jetpack -->
    <div id="jetpack-pickup-overlay" class="fixed inset-0 pointer-events-none opacity-0 transition-opacity duration-700 z-10"
         style="background: radial-gradient(circle, rgba(0, 243, 255, 0.35) 0%, rgba(255, 85, 0, 0.25) 60%, transparent 100%); mix-blend-mode: screen;"></div>

    <!-- HUD del jugador: cronómetro y única barra de salud. -->
    <div id="hud" class="fixed inset-0 pointer-events-none z-20 flex flex-col items-center justify-start pt-3 sm:pt-4 px-4">
        <div id="hud-bars-container" class="w-full max-w-xs flex flex-col items-center gap-1">
            <div id="battle-timer-dom" aria-live="off" style="display:none;color:#dcf9ff;text-shadow:0 0 9px #008cbb;letter-spacing:.18em"
                 class="font-orbitron font-bold text-lg">04:00</div>
            <div class="w-3/5 h-2.5 bg-emerald-950/80 border border-emerald-500/80 rounded overflow-hidden p-0.5 shadow-[0_0_12px_rgba(16,185,129,0.35)]">
                <div id="player-hp-bar" class="h-full bg-gradient-to-r from-emerald-600 to-green-400 transition-all duration-150" style="width:100%"></div>
            </div>
        </div>
    </div>

    <!-- Pantalla inicial mínima: título, equipo y botón ENTER. -->
    <div id="menu-modal" class="fixed inset-0 z-30 flex items-center justify-center bg-black/95 p-4">
        <div class="w-full max-w-md rounded-2xl border border-orange-500/45 bg-gradient-to-b from-slate-950 to-black px-6 py-10 text-center shadow-[0_0_65px_rgba(255,69,0,0.18)]">
            <h1 class="font-orbitron text-3xl sm:text-4xl font-black uppercase tracking-widest text-white hud-glow-orange mb-10">
                BATALLA FINAL
            </h1>
            <section id="codexia-team-picker" aria-label="Seleccionar equipo"
                     class="rounded-xl border border-cyan-600/50 bg-slate-950/75 p-5 mb-10">
                <h2 class="font-orbitron text-cyan-200 text-sm font-bold tracking-widest mb-5">SELECCIONAR EQUIPO</h2>
                <div class="flex justify-center items-center gap-4">
                    <button id="team-minus" type="button" aria-label="Equipo anterior"
                            class="team-step" style="font-size:30px;min-width:58px;min-height:56px;border-radius:12px;border:1px solid #41c9d5;background:#10232e;color:white">−</button>
                    <output id="team-number" aria-live="polite" style="color:white;min-width:132px;font:bold 21px Orbitron,monospace">EQUIPO 1</output>
                    <button id="team-plus" type="button" aria-label="Equipo siguiente"
                            class="team-step" style="font-size:30px;min-width:58px;min-height:56px;border-radius:12px;border:1px solid #41c9d5;background:#10232e;color:white">+</button>
                </div>
            </section>
            <button id="start-btn" type="button" aria-label="Entrar a Batalla final" title="Entrar a Batalla final"
                    class="mx-auto flex items-center justify-center w-32 h-16 rounded-xl border-2 border-orange-400/80 bg-gradient-to-b from-orange-700 to-red-800 text-white shadow-[0_0_32px_rgba(255,85,0,0.42)] hover:from-orange-600 hover:to-red-600 active:scale-95 transition font-orbitron font-black tracking-widest"
                    style="font-size:22px;line-height:1;">
                <span>ENTER</span>
            </button>
        </div>
    </div>

    <div id="jetpack-password-overlay" role="dialog" aria-modal="true" aria-label="Password del jetpack">
        <form id="jetpack-password-form" autocomplete="off">
            <div style="font-size:22px;font-weight:bold;">JARVIS // ACCESO AL JETPACK</div>
            <p style="margin-top:12px;color:#91cad4;">Coloca el password que descubrimos en el taller tres de Desarrollo Móvil.</p>
            <input id="jetpack-password-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" aria-label="Contraseña de cuatro dígitos" required>
            <div id="jetpack-password-feedback" aria-live="polite" style="color:#93cdd7;min-height:28px;">Introduce los cuatro dígitos</div>
            <button type="submit">DESBLOQUEAR JETPACK</button>
        </form>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // ============================================================================
        // 1. CONFIGURACIÓN DE COLORES ARC, HÁPTICA WEBXR Y SONIDOS MP3
        // ============================================================================
        const weaponColors = {
            int: 0x00ed55,      // VERDE
            float: 0x187dff,    // AZUL
            string: 0xffdf00,   // AMARILLO
            bool: 0xff3333      // ROJO
        };
        const weaponNames = {
            int: 'ARC-VERDE',
            float: 'ARC-AZUL',
            string: 'ARC-AMARILLO',
            bool: 'ARC-ROJO'
        };
        // La turbina sólo acepta un disparo del color que la contrarresta.
        // AMARILLO -> ROJO; ROJO -> VERDE; VERDE -> AZUL; AZUL -> AMARILLO.
        const weaknessByTurbine = Object.freeze({
            bool: 'string', // Turbina roja <- pistola amarilla
            int: 'bool',    // Turbina verde <- pistola roja
            float: 'int',   // Turbina azul <- pistola verde
            string: 'float' // Turbina amarilla <- pistola azul
        });
        const unlockedWeapons = ['string', 'int', 'bool', 'float']; // AMARILLO, VERDE, ROJO, AZUL
        let currentWeaponIndex = 0;
        let weaponSwitchCooldown = 0;
        let rightStickWeaponAxisWasActive = false;

        const SHOT_AUDIO_URL = './shot_comprimido.mp3'; // Disparo del protagonista: MP3 aportado, sin capas sintetizadas
        const SOUNDTRACK_AUDIO_URL = 'https://raw.githubusercontent.com/MarioDuran/VariableOverload/main/Siege_of_the_Colossus.mp3';
        const BOSS_SHOOT_AUDIO_URL = './power-beam-sound-effect.mp3'; // Únicamente al disparar el orbe de Ultron
        const STARTING_UP_AUDIO_URL = './StartingUp.mp3'; // Sonido/rugido inicial anterior del mecha
        const ROBOT_POWERUP_AUDIO_URL = './robot_encendido.mp3'; // Nuevo encendido: inicia al terminar el rugido
        const ROBOT_STEP_AUDIO_URL = './RobotStep.mp3'; // Pisadas sincronizadas
        const JETPACK_THRUST_AUDIO_URL = './jetpack_ligero.mp3'; // Clip aportado por el usuario; bucle mientras impulsa
        const THUNDER_AUDIO_URL = './trueno_relampago.mp3'; // Trueno grabado y comprimido para rayos de tormenta

        const soundCache = new Map();
        function playSoundResource(url, volume = 1.0) {
            if (!soundCache.has(url)) {
                const base = new Audio(url);
                base.crossOrigin = 'anonymous';
                base.preload = 'auto';
                base.load();
                soundCache.set(url, base);
            }
            const audio = soundCache.get(url).cloneNode(true);
            audio.crossOrigin = 'anonymous';
            audio.volume = volume;
            audio.play().catch(() => {});
        }


        // Reutiliza unas pocas voces HTMLAudio para los disparos, sin generar osciladores
        // WebAudio y sin crear indefinidamente elementos de audio en Quest.
        const fireAudioPools = new Map();
        function playPooledFireSound(url, volume = 1.0, maxVoices = 8) {
            let pool = fireAudioPools.get(url);
            if (!pool) {
                pool = { voices: [], nextVoice: 0 };
                fireAudioPools.set(url, pool);
            }
            let voice = pool.voices.find(a => a.paused || a.ended);
            if (!voice && pool.voices.length < maxVoices) {
                const base = soundCache.get(url) || new Audio(url);
                voice = base.cloneNode(true);
                voice.preload = 'auto';
                pool.voices.push(voice);
            }
            if (!voice) {
                // Limite de voces: sustituye la mas antigua en vez de añadir otra.
                voice = pool.voices[pool.nextVoice];
                pool.nextVoice = (pool.nextVoice + 1) % pool.voices.length;
                voice.pause();
            }
            voice.volume = Math.min(1, Math.max(0, volume));
            try { voice.currentTime = 0; } catch (err) {}
            voice.play().catch(() => {});
        }

        // Audios locales, precargados; el rugido termina ANTES de comenzar el encendido.
        for (const url of [STARTING_UP_AUDIO_URL, ROBOT_POWERUP_AUDIO_URL, ROBOT_STEP_AUDIO_URL, SHOT_AUDIO_URL, BOSS_SHOOT_AUDIO_URL, JETPACK_THRUST_AUDIO_URL, THUNDER_AUDIO_URL]) {
            const clip = new Audio(url);
            clip.preload = 'auto';
            clip.load();
            soundCache.set(url, clip);
        }

        // La secuencia tiene instancias de audio propias para no superponer rugido y encendido.
        // El token implícito de referencia impide que un 'ended' antiguo se dispare tras reiniciar.
        let awakeningSoundSequence = null;
        function stopAwakeningSoundSequence() {
            const previous = awakeningSoundSequence;
            awakeningSoundSequence = null;
            if (!previous) return;
            for (const audio of [previous.roar, previous.powerUp]) {
                audio.onended = null;
                audio.onerror = null;
                audio.pause();
                try { audio.currentTime = 0; } catch (err) {}
            }
        }
        function startAwakeningSoundSequence() {
            stopAwakeningSoundSequence();
            const roar = soundCache.get(STARTING_UP_AUDIO_URL).cloneNode(true);
            const powerUp = soundCache.get(ROBOT_POWERUP_AUDIO_URL).cloneNode(true);
            roar.volume = 1.0;
            powerUp.volume = 0.92;
            const sequence = { roar, powerUp };
            awakeningSoundSequence = sequence;
            let startedPowerUp = false;
            const playPowerUp = () => {
                if (startedPowerUp || awakeningSoundSequence !== sequence ||
                    !gameState.ultronAwakening || gameState.isGameOver) return;
                startedPowerUp = true;
                powerUp.play().catch(() => {});
            };
            roar.onended = playPowerUp;
            roar.onerror = playPowerUp; // Si faltara el clip anterior, intenta el nuevo.
            roar.play().catch(playPowerUp);
        }

        function triggerControllerHaptics(handedness = 'both', intensity = 0.5, durationMs = 40) {
            const session = renderer.xr.getSession();
            if (!session) return;
            for (const source of session.inputSources) {
                if (handedness !== 'both' && source.handedness !== handedness) continue;
                const gp = source.gamepad;
                if (!gp) continue;
                try {
                    if (gp.hapticActuators && gp.hapticActuators.length > 0 && gp.hapticActuators[0].pulse) {
                        gp.hapticActuators[0].pulse(THREE.MathUtils.clamp(intensity, 0, 1), durationMs);
                    } else if (gp.vibrationActuator && gp.vibrationActuator.playEffect) {
                        gp.vibrationActuator.playEffect('dual-rumble', {
                            startDelay: 0,
                            duration: durationMs,
                            weakMagnitude: THREE.MathUtils.clamp(intensity, 0, 1),
                            strongMagnitude: THREE.MathUtils.clamp(intensity, 0, 1)
                        });
                    }
                } catch (err) {}
            }
        }


// ============================================================================
// 2. AUDIO EXCLUSIVAMENTE DE ARCHIVOS GRABADOS (SIN SÍNTESIS)
// ============================================================================
class SoundSystem {
    constructor() {
        this.jetpackAudio = soundCache.get(JETPACK_THRUST_AUDIO_URL).cloneNode(true);
        this.jetpackAudio.preload = 'auto';
        this.jetpackAudio.loop = true;
        this.jetpackAudio.volume = 0.64;
        this.jetpackPlaying = false;
    }

    init() {
        // No inicializamos osciladores, buffers de ruido ni AudioContext propios.
        // El navegador habilita los MP3 tras la interacción del usuario.
    }

    playPlayerShoot() { playPooledFireSound(SHOT_AUDIO_URL, 0.88, 8); }
    playBossShoot() { playPooledFireSound(BOSS_SHOOT_AUDIO_URL, 0.92, 2); }
    playCannonBeamBlast() { this.playBossShoot(); }
    playColossalFootstep() { playSoundResource(ROBOT_STEP_AUDIO_URL, 0.96); }
    playMechaAwakeningSequence() { startAwakeningSoundSequence(); }

    setJetpackThrusterActive(active) {
        // Flanco de activación/desactivación, no reiniciar MP3 en cada fotograma.
        if (active === this.jetpackPlaying) return;
        this.jetpackPlaying = active;
        if (active) {
            this.jetpackAudio.play().catch(() => {
                // Reintentar en el siguiente frame si aún no hay permiso de audio.
                this.jetpackPlaying = false;
            });
        } else {
            this.jetpackAudio.pause();
            try { this.jetpackAudio.currentTime = 0; } catch (err) {}
        }
    }

    stopJetpack() { this.setJetpackThrusterActive(false); }

    // Sin grabación correspondiente: no producir ruido u osciladores sintéticos.
    // Se mantienen intactos los efectos VISUALES de impacto, fuego y rayos.
    playJetpackEquip() {}
    playCriticalHit() {}
    playArmorRicochet() {}
    playTurbineDestroyed() {}
    playPowerDownCollapse() {}
    playThunder(intensity = 1.0) {
        // Grabación de trueno con un pool de tres voces; permite relámpagos cercanos
        // sin crear osciladores ni reiniciar el audio en cada fotograma.
        playPooledFireSound(THUNDER_AUDIO_URL, THREE.MathUtils.clamp(0.60 * intensity, 0.35, 0.78), 3);
    }
}

        const sound = new SoundSystem();

        // ============================================================================
        // 3. ESCENA THREE.JS, WEBXR, CÁMARA Y ESCALA TITÁNICA 75.0x
        // ============================================================================
        const COLOSSAL_SCALE = 75.0; // +50% sobre 50.0: ~562.5 metros de altura
        const LOCAL_GROUND_OFFSET_Y = 3.49; // Compensa GROUND_SURFACE_Y (-3.49) para apoyar las botas en Y = 0.0

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.55;
        renderer.shadowMap.enabled = false; // Sombras de contacto simuladas, sin shadow passes costosos.
        renderer.xr.enabled = true;

        // Los perfiles son presupuestos visuales, no inferencia de soporte WebXR.
        // La detección UA es solamente orientativa; el usuario puede corregirla en el menú.
        const presetFromURL = new URLSearchParams(location.search).get('graphics');
        const headsetHint = /Quest 3(?:\b|\D)/i.test(navigator.userAgent) ? 'quest3' : 'questpro';
        let selectedVisualMode = ['quest3', 'questpro'].includes(presetFromURL) ? presetFromURL : 'auto';
        let visualProfile = selectedVisualMode === 'auto' ? headsetHint : selectedVisualMode;
        const VISUAL_PRESETS = Object.freeze({
            quest3: { xrScale: 0.98, foveation: 0.4, cloudFraction: 1.0, rainFraction: 1.0, rippleCount: 260 },
            questpro: { xrScale: 0.85, foveation: 0.65, cloudFraction: 0.72, rainFraction: 0.74, rippleCount: 150 }
        });
        // Debe configurarse ANTES de iniciar la sesión; el framebuffer no se cambia en XR.
        renderer.xr.setFramebufferScaleFactor(VISUAL_PRESETS[visualProfile].xrScale);

        // Vectores y objetos reutilizables para evitar Garbage Collection por fotograma
        const _v1 = new THREE.Vector3();
        const _v2 = new THREE.Vector3();
        const _v3 = new THREE.Vector3();
        const _fwDir = new THREE.Vector3();
        const _rtDir = new THREE.Vector3();
        const _playerWorldPos = new THREE.Vector3();
        const _turbineWorldPos = new THREE.Vector3();
        const _rotMatrix = new THREE.Matrix4();
        const _darkSmokeColor = new THREE.Color(0x14161d);
        const _desktopDummyGun = new THREE.Object3D();

        const scene = new THREE.Scene();
        // El mecha sigue oculto antes del Jetpack; ya se ve la tormenta y el suelo negro.
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x010209, 0.00068); // Azul casi negro, un poco más oscuro

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.03).texture;

        // Textura radial aditiva super intensa para resplandores volumétricos en VR y Web
        function createRadialGlowTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(128, 128, 2, 128, 128, 126);
            g.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
            g.addColorStop(0.24, 'rgba(255, 245, 215, 0.98)');
            g.addColorStop(0.52, 'rgba(255, 150, 40, 0.65)');
            g.addColorStop(0.80, 'rgba(255, 55, 0, 0.24)');
            g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(c);
        }
        const volumetricGlowTex = createRadialGlowTexture();

        // Textura procedural de humo denso para las explosiones y columnas de humo de las turbinas
        function createSmokePuffTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, 256, 256);
            for (let i = 0; i < 9; i++) {
                const ox = 128 + (Math.random() - 0.5) * 32;
                const oy = 128 + (Math.random() - 0.5) * 32;
                const rad = 44 + Math.random() * 32;
                const g = ctx.createRadialGradient(ox, oy, 4, ox, oy, rad);
                g.addColorStop(0.0, 'rgba(210, 215, 225, 0.34)');
                g.addColorStop(0.55, 'rgba(120, 125, 135, 0.14)');
                g.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(ox, oy, rad, 0, Math.PI * 2);
                ctx.fill();
            }
            // Máscara circular estricta para que jamás se note el borde cuadrado del plano/sprite en VR
            ctx.globalCompositeOperation = 'destination-in';
            const maskGrad = ctx.createRadialGradient(128, 128, 40, 128, 128, 120);
            maskGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
            maskGrad.addColorStop(0.75, 'rgba(255, 255, 255, 0.65)');
            maskGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = maskGrad;
            ctx.fillRect(0, 0, 256, 256);
            ctx.globalCompositeOperation = 'source-over';
            return new THREE.CanvasTexture(c);
        }
        const smokePuffTex = createSmokePuffTexture();

        const ultronVolumetricSprites = [];

        function registerUltronGlowSprite(parentObj, colorHex, scaleX, scaleY, localPos, localYEstimate = 2.0) {
            const sMat = new THREE.SpriteMaterial({
                map: volumetricGlowTex,
                color: colorHex,
                transparent: true,
                opacity: 0.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                fog: false
            });
            const sprite = new THREE.Sprite(sMat);
            sprite.position.copy(localPos);
            sprite.visible = false;
            // Reducimos a la mitad el resplandor de los halos volumétricos de reactores y turbinas
            const boostedX = scaleX * 0.85;
            const boostedY = scaleY * 0.85;
            sprite.scale.set(boostedX, boostedY, 1);
            parentObj.add(sprite);
            ultronVolumetricSprites.push({
                sprite,

                const previo = pendientes.find(x => x.equipo === equipo);
                if (previo) previo.puntaje = Math.max(previo.puntaje, puntaje);
                else pendientes.push({equipo, puntaje});
                localStorage.setItem(CODEXIA_PENDING_KEY, JSON.stringify(pendientes));
            } catch (err) { console.warn('CODEXIA: almacenamiento local no disponible'); }
        }
        function quitarPendienteCODEXIA(equipo, puntajeConfirmado) {
            try {
                const restantes = leerPendientesCODEXIA().filter(x =>
                    x.equipo !== equipo || x.puntaje > puntajeConfirmado);
                localStorage.setItem(CODEXIA_PENDING_KEY, JSON.stringify(restantes));
            } catch (err) {}
        }
        async function enviarBatallaFinal(equipo, score) {
            if (!Number.isInteger(equipo) || equipo < 1 || equipo > 20) throw new Error('Equipo fuera de 1..20');
            if (!Number.isInteger(score) || score < 0 || score > 100) throw new Error('Puntuación fuera de 0..100');
            const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${CODEXIA_BATALLA_RPC}`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({p_equipo: equipo, p_puntaje: score}),
                cache: 'no-store', keepalive: true
            });
            const raw = await respuesta.text();
            if (!respuesta.ok) {
                let detalle = raw;
                try { const obj = JSON.parse(raw); detalle = obj.message || obj.details || raw; } catch (err) {}
                if (respuesta.status === 404) detalle = 'Falta instalar SQL/01_REGISTRAR_BATALLA_FINAL.sql en Supabase';
                throw new Error(`Supabase HTTP ${respuesta.status}: ${String(detalle).slice(0, 155)}`);
            }
            // El RPC responde el valor REAL almacenado en batalla_final.
            // Un 200 sin valor de confirmación ya NO se interpreta como guardado.
            let valorAlmacenado = NaN;
            try {
                const confirmado = JSON.parse(raw);
                // Rechaza null / true / {} y respuestas vacías incluso si score=0.
                if (typeof confirmado === 'number' ||
                    (typeof confirmado === 'string' && /^\d+(?:\.\d+)?$/.test(confirmado.trim()))) {
                    valorAlmacenado = Number(confirmado);
                }
            } catch (err) {}
            if (!Number.isFinite(valorAlmacenado) || valorAlmacenado < score || valorAlmacenado > 100) {
                throw new Error('Supabase no confirmó el valor de batalla_final; revisa la función SQL');
            }
            return valorAlmacenado;
        }
        async function submitBattleGrade(result) {
            const battle = gameState.battle;
            if (!result || result !== battle.result || battle.uploadStatus === 'sending' || battle.uploadStatus === 'saved') return;
            guardarPendienteCODEXIA(result.team, result.grade.score);
            battle.uploadStatus = 'sending';
            battle.uploadError = '';
            redrawGameOverPanel();
            try {
                const confirmado = await enviarBatallaFinal(result.team, result.grade.score);
                battle.uploadStatus = 'saved';
                battle.savedScore = confirmado;
                quitarPendienteCODEXIA(result.team, confirmado);
            } catch (err) {
                battle.uploadStatus = 'error';
                battle.uploadError = String(err?.message || err).slice(0, 220);
                console.warn('CODEXIA: puntuación PENDIENTE:', battle.uploadError);
            }

        async function reenviarPendientesCODEXIA() {
            for (const {equipo, puntaje} of leerPendientesCODEXIA()) {

                // Si este equipo se está registrando en el resultado actual,
                // dejamos que su petición termine para evitar carreras innecesarias.
                if (gameState.battle.uploadStatus === 'sending' && gameState.battle.result?.team === equipo) continue;
                codexiaUploadsEnCurso.add(equipo);
                try {
                    const confirmado = await enviarBatallaFinal(equipo, puntaje);
                    quitarPendienteCODEXIA(equipo, confirmado);
                    const battle = gameState.battle;
                    if (battle.result?.team === equipo && battle.result?.grade?.score === puntaje) {
                        battle.savedScore = confirmado;
                        battle.uploadStatus = 'saved';
                        battle.uploadError = '';
                        redrawGameOverPanel();
                    }
                } catch (err) {
                    console.warn('CODEXIA: envío anterior todavía pendiente:', String(err?.message || err));
                } finally { codexiaUploadsEnCurso.delete(equipo); }
            }

        // ============================================================================
        const BOOT_START_Y = -110.0;
        const BOOT_END_Y = 700.0; // Ilumina la nueva altura de ~562.5 m y deja margen de transición
        // Rugido antiguo (~1.15 s), seguido del nuevo encendido (~23.04 s).

        // Detalle PBR compartido: microarañazos, metal cepillado y rugosidad irregular.
        // Dos texturas pequeñas, repetidas en UV, evitan geometría y draw calls adicionales.
        function buildArmorDetailMaps() {
            const side = 256;
            const roughCanvas = document.createElement('canvas');
            const normalCanvas = document.createElement('canvas');
            roughCanvas.width = roughCanvas.height = normalCanvas.width = normalCanvas.height = side;
            const roughCtx = roughCanvas.getContext('2d');
            const normalCtx = normalCanvas.getContext('2d');
            const roughData = roughCtx.createImageData(side, side);
            const normalData = normalCtx.createImageData(side, side);
            const heights = new Float32Array(side * side);
            const hash = (x, y) => {
                let h = Math.imul((x + 2048) | 0, 374761393) + Math.imul((y + 2048) | 0, 668265263);
                h = Math.imul(h ^ (h >>> 13), 1274126177);
                return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
            };
            for (let y = 0; y < side; y++) for (let x = 0; x < side; x++) {
                const micro = hash(x, y);
                const brushed = 0.20 * Math.sin(x * 0.44) + 0.11 * Math.sin(x * 1.93);
                const longScratch = hash((x / 9) | 0, (y / 61) | 0) > 0.925 ? 0.22 : 0;
                heights[y * side + x] = (micro - 0.5) * 0.22 + brushed + longScratch;
                const v = Math.round(165 + micro * 62 + brushed * 25 + longScratch * 22);
                const i = (y * side + x) * 4;
                roughData.data[i] = roughData.data[i+1] = roughData.data[i+2] = v;
                roughData.data[i+3] = 255;
            }
            for (let y = 0; y < side; y++) for (let x = 0; x < side; x++) {
                const xm = (x - 1 + side) % side, xp = (x + 1) % side;
                const ym = (y - 1 + side) % side, yp = (y + 1) % side;
                const dx = heights[y * side + xp] - heights[y * side + xm];
                const dy = heights[yp * side + x] - heights[ym * side + x];
                const nx = -dx * 0.65, ny = -dy * 0.65, inv = 1 / Math.hypot(nx, ny, 1);
                const i = (y * side + x) * 4;
                normalData.data[i] = Math.round((nx * inv * 0.5 + 0.5) * 255);
                normalData.data[i+1] = Math.round((ny * inv * 0.5 + 0.5) * 255);
                normalData.data[i+2] = Math.round(inv * 255);
                normalData.data[i+3] = 255;
            }
            roughCtx.putImageData(roughData, 0, 0);
            normalCtx.putImageData(normalData, 0, 0);
            const setup = c => {
                const t = new THREE.CanvasTexture(c);
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(5, 5);
                t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
                return t;
            };
            return { rough: setup(roughCanvas), normal: setup(normalCanvas) };
        }

        // Inyecta el barrido vertical de encendido con degradado ultra difuminado (~120m) y ondulación orgánica
        function injectVerticalBootShader(mat) {
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uBootSweepY = bootSweepUniform;
                shader.vertexShader = `
                    varying float vWorldY;
                    varying float vCamDist;
                    varying vec3 vWorldPosBoot;
                ` + shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                    vec4 wpBoot = modelMatrix * vec4(transformed, 1.0);
                    vWorldPosBoot = wpBoot.xyz;
                    vWorldY = wpBoot.y;
                    vCamDist = length(cameraPosition - wpBoot.xyz);`
                );

                if (shader.fragmentShader.includes('#include <emissivemap_fragment>')) {
                    shader.fragmentShader = `
                        uniform float uBootSweepY;
                        varying float vWorldY;
                        varying float vCamDist;
                        varying vec3 vWorldPosBoot;
                    ` + shader.fragmentShader.replace(
                        '#include <emissivemap_fragment>',
                        `#include <emissivemap_fragment>
                        float waveActive = smoothstep(-60.0, -15.0, uBootSweepY);
                        float organicWave = (sin(vWorldPosBoot.x * 0.07) * 14.0 + cos(vWorldPosBoot.z * 0.07) * 14.0) * waveActive;
                        float effectiveY = vWorldY + organicWave;
                        float bootMask = (1.0 - smoothstep(uBootSweepY - 97.5, uBootSweepY + 82.5, effectiveY));
                        float scanFront = exp(-pow((effectiveY - uBootSweepY) * 0.022, 2.0)) * 0.45 * waveActive * step(uBootSweepY, 670.0);
                        totalEmissiveRadiance *= clamp(bootMask + scanFront, 0.0, 2.2);`
                    ).replace(
                        '#include <opaque_fragment>',
                        `
                        float waveActiveOut = smoothstep(-60.0, -15.0, uBootSweepY);
                        float organicWaveOut = (sin(vWorldPosBoot.x * 0.07) * 14.0 + cos(vWorldPosBoot.z * 0.07) * 14.0) * waveActiveOut;
                        float whiteLightMask = (1.0 - smoothstep(uBootSweepY - 105.0, uBootSweepY + 82.5, vWorldY + organicWaveOut));
                        float distHaze = clamp((vCamDist - 110.0) / 780.0, 0.0, 0.58);
                        float heightHaze = clamp(vWorldY / 630.0, 0.0, 0.42);
                        vec3 stormHazeColor = vec3(0.011, 0.020, 0.037) * whiteLightMask;
                        outgoingLight = mix(outgoingLight, stormHazeColor, clamp(distHaze + heightHaze * 0.45, 0.0, 0.65));
                        outgoingLight *= whiteLightMask;
                        #include <opaque_fragment>
                        `
                    );
                } else {
                    shader.fragmentShader = `
                        uniform float uBootSweepY;
                        varying float vWorldY;
                        varying vec3 vWorldPosBoot;
                    ` + shader.fragmentShader.replace(
                        '#include <color_fragment>',
                        `#include <color_fragment>
                        float waveActiveBasic = smoothstep(-60.0, -15.0, uBootSweepY);
                        float organicWaveBasic = (sin(vWorldPosBoot.x * 0.07) * 12.0 + cos(vWorldPosBoot.z * 0.07) * 12.0) * waveActiveBasic;
                        float bootMask = (1.0 - smoothstep(uBootSweepY - 87.0, uBootSweepY + 72.0, vWorldY + organicWaveBasic));
                        diffuseColor.rgb *= bootMask;
                        diffuseColor.a *= bootMask;`
                    );
                }
            };
            mat.needsUpdate = true;
        }

        [

        const colossalUltronAnchor = new THREE.Group();

        const explodableParts = [];
        function registerExplodable(mesh, directionVec, distanceScale = 1.0) {
            mesh.userData.basePos = mesh.position.clone();
            mesh.userData.explodeVec = directionVec.clone().normalize().multiplyScalar(distanceScale);
            explodableParts.push(mesh);
        }

        // Temblor mecánico original del visor Ultron Prestige MK-X, adaptado a escala 75x.
        // El movimiento ocurre en el propio robot: en VR NO se altera la cámara del visor.
        const FOOTSTEP_TREMOR = Object.freeze({
            armorJolt: 0.025,              // amplitud local de vibración de placas
            groundProximityWeight: 1.95,   // botas/piernas tiemblan más que la cabeza
            armorFrequency: 38.0,
            armorDecay: 0.048,             // factor de decaimiento por segundo
            chassisDuration: 0.50,        // sacudida amortiguada del cuerpo (s)
            chassisStrength: 1.0
        });
        const footstepTremor = { armorAmplitude: 0, phase: 0, chassisRemaining: 0, armorMoving: false };
        const footstepChassisMotion = [0, 0, 0, 0]; // reutilizado: sin asignaciones por fotograma
        const footstepWorldTmp = new THREE.Vector3();

        function prepareFootstepArmorWeights() {
            // El modelo ya está ensamblado. Se calcula solo una vez la cercanía al suelo.
            colossalUltronAnchor.updateMatrixWorld(true);
            explodableParts.forEach(part => {
                part.getWorldPosition(footstepWorldTmp);
                const relativeHeight = (footstepWorldTmp.y - colossalUltronAnchor.position.y) / COLOSSAL_SCALE;
                const nearGround = 1.0 - THREE.MathUtils.clamp(relativeHeight / 7.5, 0, 1);
                part.userData.footstepProximity = Math.pow(nearGround, 1.45);
            });
        }

        function initiateFootstepTremor() {
            footstepTremor.armorAmplitude = FOOTSTEP_TREMOR.armorJolt;
            footstepTremor.phase = 0;
            footstepTremor.chassisRemaining = FOOTSTEP_TREMOR.chassisDuration;
        }

        function updateFootstepArmorTremor(dt) {
            if (footstepTremor.armorAmplitude > 0.0001) {
                footstepTremor.phase += dt * FOOTSTEP_TREMOR.armorFrequency;
                footstepTremor.armorAmplitude *= Math.pow(FOOTSTEP_TREMOR.armorDecay, dt);
            } else {
                footstepTremor.armorAmplitude = 0;
            }
            const moving = footstepTremor.armorAmplitude > 0;
            if (!moving && !footstepTremor.armorMoving) return;
            for (let i = 0; i < explodableParts.length; i++) {
                const part = explodableParts[i];
                const groundWeight = 0.40 + (part.userData.footstepProximity ?? 0.5) * FOOTSTEP_TREMOR.groundProximityWeight;
                const jolt = footstepTremor.armorAmplitude * groundWeight;
                const rattle = jolt * (0.55 + 0.45 * Math.sin(footstepTremor.phase + i * 1.9));
                // Restaurar siempre la posición base: no hay deriva acumulativa entre pasos.
                part.position.copy(part.userData.basePos).addScaledVector(part.userData.explodeVec, rattle);
                part.position.y -= jolt * 0.30 * Math.abs(Math.cos(footstepTremor.phase * 0.65 + i));
            }
            footstepTremor.armorMoving = moving;
        }

        function getFootstepChassisMotion(dt) {
            if (footstepTremor.chassisRemaining <= 0) {
                footstepChassisMotion.fill(0);
                return footstepChassisMotion;
            }
            footstepTremor.chassisRemaining = Math.max(0, footstepTremor.chassisRemaining - dt);
            const progressRemaining = footstepTremor.chassisRemaining / FOOTSTEP_TREMOR.chassisDuration;
            const envelope = Math.sin(progressRemaining * Math.PI) * FOOTSTEP_TREMOR.chassisStrength;
            footstepChassisMotion[0] = -envelope * Math.abs(Math.sin(progressRemaining * Math.PI * 2.5)) * 0.011;
            footstepChassisMotion[1] = envelope * Math.sin(progressRemaining * Math.PI * 4.0) * 0.0045;
            footstepChassisMotion[2] = envelope * Math.sin(progressRemaining * Math.PI * 2.0) * 0.0055;
            footstepChassisMotion[3] = envelope * Math.sin(progressRemaining * Math.PI * 3.0) * 0.0022;
            return footstepChassisMotion;
        }

        function clearFootstepTremor() {
            footstepTremor.armorAmplitude = 0;
            footstepTremor.phase = 0;
            footstepTremor.chassisRemaining = 0;
            footstepTremor.armorMoving = false;
            footstepChassisMotion.fill(0);
            explodableParts.forEach(part => part.position.copy(part.userData.basePos));
        }

        const legJoints = {
            left:  { hip: null, knee: null, ankle: null },

        };
        const footstepContactPoints = { left: null, right: null };

        const animatedTurbines = [];
        const vulnerableTurbines = []; // Las 4 turbinas de colores ARC para destruir a Ultron

        function createBeveledPlate(points2D, depth = 0.08, bevelSize = 0.025, bevelThickness = 0.025, mat = materials.armorPrimary) {
            const shape = new THREE.Shape();

        function createCyberTurbine(radius = 0.35, depth = 0.16, bladeCount = 12, arcType = null, localYEstimate = 2.0) {
            const group = new THREE.Group();

            let coreMat = materials.emissiveCore;
            let hotMat = materials.emissiveHot;
            let colorHex = 0xff3b00;

            if (arcType && weaponColors[arcType]) {

                    emissive: colorHex,
                    emissiveIntensity: 3.2,

                });
                injectVerticalBootShader(coreMat);

            }

            const outerRingGeo = new THREE.TorusGeometry(radius, radius * 0.18, 16, 40);
            outerRingGeo.scale(1, 1, depth / (radius * 0.18));
            const outerRing = new THREE.Mesh(outerRingGeo, materials.armorPrimary);

            const backDisk = new THREE.Mesh(
                new THREE.CylinderGeometry(radius * 0.92, radius * 0.92, depth * 0.5, 32),
                materials.darkJoint
            );
            backDisk.rotation.x = Math.PI / 2;
            backDisk.position.z = -depth * 0.25;
            group.add(backDisk);

            const glowRingOuter = new THREE.Mesh(
                new THREE.TorusGeometry(radius * 0.78, radius * 0.055, 12, 36),

            );
            glowRingOuter.position.z = depth * 0.08;
            group.add(glowRingOuter);

            const glowRingInner = new THREE.Mesh(
                new THREE.TorusGeometry(radius * 0.52, radius * 0.045, 12, 32),
                hotMat
            );
            glowRingInner.position.z = depth * 0.02;
            group.add(glowRingInner);

            const rotorGroup = new THREE.Group();
            const bladeGeo = new THREE.BoxGeometry(radius * 0.36, radius * 0.045, depth * 0.35);
            for (let i = 0; i < bladeCount; i++) {
                const angle = (i / bladeCount) * Math.PI * 2;
                const blade = new THREE.Mesh(bladeGeo, materials.underSuit);
                blade.position.set(
                    Math.cos(angle) * radius * 0.56,
                    Math.sin(angle) * radius * 0.56,
                    0
                );
                blade.rotation.z = angle + 0.45;
                blade.rotation.y = 0.35;
                rotorGroup.add(blade);
            }

            const centerCap = new THREE.Mesh(
                new THREE.CylinderGeometry(radius * 0.26, radius * 0.32, depth * 0.6, 20),

                materials.underSuit
            );
            pauldronGroup.add(deltoidCore);

            const shoulderArcType = side === 1 ? 'int' : 'float';
            const shoulderTurbine = createCyberTurbine(0.40, 0.22, 14, shoulderArcType, 2.22);
            shoulderTurbine.position.set(side * 0.16, -0.02, 0.30);
            shoulderTurbine.rotation.set(0.05, side * 0.45, 0);
            pauldronGroup.add(shoulderTurbine);

            const topPauldron = createBeveledPlate([
                [-0.38, -0.15], [-0.25, 0.35], [-0.02, 0.62], [0.08, 0.34],
                [0.34, 0.52], [0.48, 0.15], [0.42, -0.28], [0.05, -0.12]
            ], 0.34, 0.035, 0.035, materials.armorHighlight);
            topPauldron.scale.x = side;
            topPauldron.position.set(side * 0.14, 0.26, -0.02);
            topPauldron.rotation.set(0.08, side * 0.22, -side * 0.18);
            pauldronGroup.add(topPauldron);
            registerExplodable(topPauldron, new THREE.Vector3(side * 0.8, 0.8, 0), 0.65);
        }

        function buildArmSegments(side, shoulderPivot, elbowPivot, wristPivot) {
            const bicepGroup = new THREE.Group();
            bicepGroup.position.set(side * 0.16, -0.72, 0);
            shoulderPivot.add(bicepGroup);

            const bicepCore = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28, 0.23, 1.03, 16),
                materials.underSuit
            );
            bicepGroup.add(bicepCore);

            const bicepPlate = createBeveledPlate([
                [-0.20, 0.43], [0.22, 0.35], [0.25, -0.35], [0.0, -0.48], [-0.22, -0.33]
            ], 0.16, 0.025, 0.025, materials.armorPrimary);
            bicepPlate.scale.x = side;
            bicepPlate.position.set(side * 0.08, 0.02, 0.16);
            bicepPlate.rotation.y = side * 0.35;
            bicepGroup.add(bicepPlate);

            elbowPivot.position.set(side * 0.18, -1.275, 0.0);
            shoulderPivot.add(elbowPivot);

            const elbowJoint = new THREE.Mesh(
                new THREE.CylinderGeometry(0.20, 0.20, 0.36, 16),
                materials.darkJoint
            );
            elbowJoint.rotation.z = Math.PI / 2;
            elbowPivot.add(elbowJoint);

            const forearmGroup = new THREE.Group();
            forearmGroup.position.set(0, -0.65, 0);
            elbowPivot.add(forearmGroup);

            const forearmCore = new THREE.Mesh(
                new THREE.CylinderGeometry(0.24, 0.17, 1.15, 16),
                materials.underSuit
            );
            forearmGroup.add(forearmCore);

            for (let f = 0; f < 4; f++) {
                const s = 1 - f * 0.075;
                const forearmPlate = createBeveledPlate([
                    [-0.20 * s, 0.22], [0.20 * s, 0.22],
                    [0.24 * s, -0.09], [0.0, -0.25], [-0.24 * s, -0.09]
                ], 0.15, 0.022, 0.022, f === 0 ? materials.armorHighlight : materials.armorPrimary);
                forearmPlate.position.set(side * 0.06, 0.32 - f * 0.24, 0.14);
                forearmPlate.rotation.set(0.08, side * 0.35, 0);
                forearmGroup.add(forearmPlate);
            }

            wristPivot.position.set(0, -1.225, 0);
            elbowPivot.add(wristPivot);

            const wristCuff = new THREE.Mesh(
                new THREE.TorusGeometry(0.17, 0.045, 12, 24),
                materials.armorHighlight
            );
            wristCuff.rotation.x = Math.PI / 2;
            wristPivot.add(wristCuff);
        }

        let rightHandGroupRef = null;
        function buildClawedHand(side, wristPivot, fingerPivotsArray, hasBrightPalmNodes = true) {
            const handGroup = new THREE.Group();
            handGroup.position.set(0, -0.16, 0);
            wristPivot.add(handGroup);
            if (side === -1) rightHandGroupRef = handGroup;

            const palmCore = createBeveledPlate([
                [-0.18, 0.16], [0.18, 0.16], [0.21, -0.16], [-0.16, -0.18]
            ], 0.13, 0.02, 0.02, materials.underSuit);
            palmCore.scale.x = side;
            handGroup.add(palmCore);

            if (hasBrightPalmNodes) {
                [-0.065, 0.075].forEach((xOff, idx) => {
                    const palmGlowNode = new THREE.Mesh(
                        new THREE.SphereGeometry(0.042, 14, 14),
                        materials.emissiveHot
                    );
                    palmGlowNode.scale.set(1, 1, 0.65);
                    // Ubicados en la cara interna de la palma (-Z, hacia donde cierran los dedos y mira hacia arriba)
                    palmGlowNode.position.set(side * xOff, -0.02 + idx * 0.03, -0.085);
                    handGroup.add(palmGlowNode);
                });
            }

            const fingerSpecs = [
                { x: -0.13 * side, y: -0.17, z: 0.0, len: 1.02, spread: -0.10 * side },
                { x: -0.04 * side, y: -0.19, z: 0.0, len: 1.12, spread: -0.02 * side },
                { x:  0.05 * side, y: -0.18, z: 0.0, len: 1.04, spread:  0.05 * side },
                { x:  0.14 * side, y: -0.15, z: 0.0, len: 0.88, spread:  0.12 * side }
            ];

            fingerSpecs.forEach((spec) => {
                const fBase = new THREE.Group();
                fBase.position.set(spec.x, spec.y, spec.z);
                fBase.rotation.z = spec.spread;
                handGroup.add(fBase);

                const ph1 = new THREE.Mesh(
                    new THREE.BoxGeometry(0.068, 0.14 * spec.len, 0.075),
                    materials.armorPrimary
                );
                ph1.position.set(0, -0.07 * spec.len, 0);
                fBase.add(ph1);

                const fMid = new THREE.Group();
                fMid.position.set(0, -0.14 * spec.len, 0);
                fBase.add(fMid);

                const ph2 = new THREE.Mesh(
                    new THREE.BoxGeometry(0.058, 0.12 * spec.len, 0.065),
                    materials.underSuit
                );
                ph2.position.set(0, -0.06 * spec.len, 0);
                fMid.add(ph2);

                const fTip = new THREE.Group();
                fTip.position.set(0, -0.12 * spec.len, 0);
                fMid.add(fTip);

                const clawMesh = createBeveledPlate([
                    [-0.02, 0.02], [0.025, 0.02], [0.032, -0.08 * spec.len],
                    [0.0, -0.22 * spec.len], [-0.028, -0.07 * spec.len]
                ], 0.036, 0.008, 0.008, materials.armorHighlight);
                clawMesh.rotation.y = Math.PI / 2;
                clawMesh.rotation.x = 0.28;
                clawMesh.position.set(0, -0.08 * spec.len, 0.02);
                fTip.add(clawMesh);

                fingerPivotsArray.push({ base: fBase, mid: fMid, tip: fTip, isThumb: false });
            });

            const thumbBase = new THREE.Group();
            thumbBase.position.set(-0.18 * side, -0.04, -0.05);
            thumbBase.rotation.set(0.3, 0.5 * side, -0.65 * side);
            handGroup.add(thumbBase);

            const thumbMid = new THREE.Group();
            thumbMid.position.set(0, -0.13, 0);
            thumbBase.add(thumbMid);

            const thumbClaw = createBeveledPlate([
                [-0.025, 0.02], [0.025, 0.02], [0.03, -0.08], [0.0, -0.20], [-0.028, -0.07]
            ], 0.042, 0.008, 0.008, materials.armorHighlight);
            thumbClaw.rotation.y = Math.PI / 2;
            thumbClaw.rotation.x = 0.35;
            thumbClaw.position.set(0, -0.08, 0.02);
            thumbMid.add(thumbClaw);

            fingerPivotsArray.push({ base: thumbBase, mid: thumbMid, tip: thumbMid, isThumb: true });
        }

        buildPauldronAndShoulder(1, leftShoulderPivot, true);
        buildPauldronAndShoulder(-1, rightShoulderPivot, false);
        buildArmSegments(1, leftShoulderPivot, leftElbowPivot, leftWristPivot);
        buildArmSegments(-1, rightShoulderPivot, rightElbowPivot, rightWristPivot);
        buildClawedHand(1, leftWristPivot, leftFingerPivots, false);
        buildClawedHand(-1, rightWristPivot, rightFingerPivots, true);

        // NODO DE SINGULARIDAD PLASMÁTICA SOBRE LA PALMA ABIERTA HACIA ARRIBA DE LA MANO DERECHA
        const handChargeNode = new THREE.Group();
        handChargeNode.position.set(0, -0.26, -0.38);
        handChargeNode.scale.setScalar(0.001);
        if (rightHandGroupRef) rightHandGroupRef.add(handChargeNode);

        const handSingularityCore = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.16, 2),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        handChargeNode.add(handSingularityCore);

        const handSingularityShell = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.28, 1),
            new THREE.MeshBasicMaterial({ color: 0xff2200, wireframe: true, transparent: true, opacity: 0.88 })
        );
        handChargeNode.add(handSingularityShell);

        const handGyroRings = [];
        for (let r = 0; r < 3; r++) {
            const gRing = new THREE.Mesh(
                new THREE.TorusGeometry(0.34 + r * 0.09, 0.018, 8, 32),
                new THREE.MeshBasicMaterial({ color: r % 2 === 0 ? 0xffaa00 : 0xff2200 })
            );
            gRing.rotation.set(r * 1.1, r * 0.7, 0);
            handChargeNode.add(gRing);
            handGyroRings.push(gRing);
        }

        const handChargeHalo = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: volumetricGlowTex,
                color: 0xff4500,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        );
        handChargeHalo.scale.set(2.2, 2.2, 1);
        handChargeNode.add(handChargeHalo);

        // RAYOS FRACTALES NORMALES EN LA MANO DERECHA (Mismo algoritmo fractal de las nubes)
        const lightningGroup = new THREE.Group();
        if (rightHandGroupRef) rightHandGroupRef.add(lightningGroup);

        const handFractalBoltGeo = new THREE.CylinderGeometry(0.8, 1.0, 1.0, 5);
        handFractalBoltGeo.translate(0, 0.5, 0);
        handFractalBoltGeo.rotateX(Math.PI * 0.5);

        const handFractalArcs = [];
        const HAND_ARC_ENDPOINTS = [
            { start: new THREE.Vector3(-0.18, -0.05, -0.08), end: new THREE.Vector3(0.05, -0.34, -0.44) },
            { start: new THREE.Vector3(0.18, -0.06, -0.08),  end: new THREE.Vector3(-0.06, -0.32, -0.42) },
            { start: new THREE.Vector3(-0.14, -0.38, -0.22), end: new THREE.Vector3(0.16, -0.35, -0.26) },
            { start: new THREE.Vector3(0.0, 0.35, -0.12),    end: new THREE.Vector3(0.02, -0.28, -0.38) },
            { start: new THREE.Vector3(-0.22, -0.25, -0.15), end: new THREE.Vector3(0.18, -0.12, -0.35) }
        ];

        // Un draw call por material en lugar de 120 mallas individuales.
        const handCoreArcMesh = new THREE.InstancedMesh(handFractalBoltGeo, materials.lightningCore, 72);
        const handEdgeArcMesh = new THREE.InstancedMesh(handFractalBoltGeo, materials.lightningEdge, 48);
        handCoreArcMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        handEdgeArcMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        handCoreArcMesh.frustumCulled = handEdgeArcMesh.frustumCulled = false;
        lightningGroup.add(handCoreArcMesh, handEdgeArcMesh);
        const arcTransform = new THREE.Object3D();
        let coreArcSlot = 0, edgeArcSlot = 0;
        for (let a = 0; a < HAND_ARC_ENDPOINTS.length; a++) {
            const core = a % 2 === 0;
            const mesh = core ? handCoreArcMesh : handEdgeArcMesh;
            const first = core ? coreArcSlot : edgeArcSlot;
            if (core) coreArcSlot += 24;
            else edgeArcSlot += 24;
            handFractalArcs.push({ mesh, first, cfg: HAND_ARC_ENDPOINTS[a], timer: a * 0.02 });
        }

        function setArcSegment(mesh, slot, a, b, radius) {
            arcTransform.position.copy(a);
            arcTransform.lookAt(b);
            arcTransform.scale.set(radius, radius, a.distanceTo(b));
            arcTransform.updateMatrix();
            mesh.setMatrixAt(slot, arcTransform.matrix);
        }

        function rebuildHandFractalArc(arc) {
            const jitterStart = arc.cfg.start.clone().add(new THREE.Vector3(
                (Math.random() - 0.5) * 0.08,
                (Math.random() - 0.5) * 0.08,
                (Math.random() - 0.5) * 0.08
            ));
            const jitterEnd = arc.cfg.end.clone().add(new THREE.Vector3(
                (Math.random() - 0.5) * 0.14,
                (Math.random() - 0.5) * 0.14,
                (Math.random() - 0.5) * 0.14
            ));
            const mainPts = subdivideLightningPath(jitterStart, jitterEnd, 4, 0.095);
            for (let i = 0; i < 16; i++) {
                setArcSegment(arc.mesh, arc.first + i, mainPts[i], mainPts[i+1],
                    THREE.MathUtils.lerp(0.011, 0.0045, i / 15));
            }
            const branchOrigin = mainPts[5 + Math.floor(Math.random() * 5)];
            const branchEnd = branchOrigin.clone().add(new THREE.Vector3(
                (Math.random() - 0.5) * 0.28,
                -0.12 - Math.random() * 0.18,
                -0.10 - Math.random() * 0.18
            ));
            const branchPts = subdivideLightningPath(branchOrigin, branchEnd, 3, 0.045);
            for (let i = 0; i < 8; i++) {
                setArcSegment(arc.mesh, arc.first + 16 + i, branchPts[i], branchPts[i+1],
                    THREE.MathUtils.lerp(0.0065, 0.002, i / 7));
            }
            arc.mesh.instanceMatrix.needsUpdate = true;
        }

        // ============================================================================
        // 7. CINEMÁTICA DE CAMINATA COLOSAL (JAEGER GAIT) Y POSTURAS
        // ============================================================================
        const POSES = {
            walk: {
                torsoRot: new THREE.Euler(0.03, -0.08, 0.0),
                headRot: new THREE.Euler(0.02, 0.08, 0.0),
                leftShoulder: new THREE.Euler(0.08, 0.08, 0.18),
                leftElbow: new THREE.Euler(-0.42, 0.0, -0.06),
                leftWrist: new THREE.Euler(0.08, -0.15, 0.08),
                // Brazo derecho adelantado y muñeca girada 180° (Math.PI) para que la palma quede hacia arriba
                rightShoulder: new THREE.Euler(-0.36, 0.18, -0.22),
                rightElbow: new THREE.Euler(-1.28, -0.10, 0.08),
                rightWrist: new THREE.Euler(-0.18, Math.PI, 0.0),
                rightClawCurl: 0.68,
                leftClawCurl: 1.55
            }
        };

        const LEG_SCALE_FACTOR = 1.18;
        const THIGH_LEN = 1.425 * LEG_SCALE_FACTOR;
        const SHIN_LEN = 1.575 * LEG_SCALE_FACTOR;
        const BASE_LEG_REACH = THIGH_LEN + SHIN_LEN;

        const STEP_MOVE_DURATION = 4.8;
        const STEP_PAUSE_DURATION = 1.0;
        const HALF_CYCLE_DURATION = STEP_MOVE_DURATION + STEP_PAUSE_DURATION;
        const FULL_GAIT_CYCLE_SECONDS = HALF_CYCLE_DURATION * 2.0;

        function smoothStep01(x) {
            const t = THREE.MathUtils.clamp(x, 0, 1);
            return t * t * (3 - 2 * t);
        }

        function computeFootKinematics(hipX, kneeX) {
            const totalPitch = hipX + kneeX;
            const verticalDrop = THIGH_LEN * Math.cos(hipX) + SHIN_LEN * Math.cos(totalPitch);
            const footForwardZ = -THIGH_LEN * Math.sin(hipX) - SHIN_LEN * Math.sin(totalPitch);
            return { verticalDrop, footForwardZ };
        }

        function evaluateJaegerGait(cyclePhase, pauseElapsed = 0, isPaused = false) {
            const p = ((cyclePhase % 1) + 1) % 1;
            let hipAngle = 0;
            let kneeAngle = 0;
            let ankleAngle = 0;
            let isImpactFrame = false;

            if (p < 0.10) {
                const t = smoothStep01(p / 0.10);
                hipAngle = THREE.MathUtils.lerp(0.30, 0.18, t);
                kneeAngle = THREE.MathUtils.lerp(0.08, 0.56, t);
                ankleAngle = -(hipAngle + kneeAngle) + 0.18 * t;
            } else if (p < 0.38) {
                const t = smoothStep01((p - 0.10) / 0.28);
                hipAngle = THREE.MathUtils.lerp(0.18, -0.42, t);
                kneeAngle = THREE.MathUtils.lerp(0.56, 0.14, t) + Math.sin(t * Math.PI) * 0.28;
                ankleAngle = -(hipAngle + kneeAngle) + 0.08 * Math.sin(t * Math.PI);
            } else if (p <= 0.5001) {
                const t = THREE.MathUtils.clamp((p - 0.38) / 0.12, 0, 1);
                const grav = t * t;
                hipAngle = THREE.MathUtils.lerp(-0.42, -0.36, grav);
                kneeAngle = THREE.MathUtils.lerp(0.14, 0.12, grav);
                ankleAngle = -(hipAngle + kneeAngle);
                if (t > 0.90 || isPaused) isImpactFrame = true;
            } else {
                const t = smoothStep01((p - 0.50) / 0.50);
                hipAngle = THREE.MathUtils.lerp(-0.36, 0.30, t);
                kneeAngle = THREE.MathUtils.lerp(0.12, 0.08, t);
                ankleAngle = -(hipAngle + kneeAngle);
            }

            const kin = computeFootKinematics(hipAngle, kneeAngle);
            return {
                hipAngle,
                kneeAngle,
                ankleAngle,
                verticalDrop: kin.verticalDrop,
                footForwardZ: kin.footForwardZ,
                isImpactFrame
            };
        }

        function applyWalkGaitFrame(gaitPhase, isPaused = false, pauseElapsed = 0, wholeBobY = 0, wholeJitterX = 0, wholeShiftZ = 0, wholeRollZ = 0) {
            if (!legJoints.left.hip || !legJoints.right.hip) return { leftGait: null, rightGait: null };

            const leftGait = evaluateJaegerGait(gaitPhase, pauseElapsed, isPaused);
            const rightGait = evaluateJaegerGait(gaitPhase + 0.5, pauseElapsed, isPaused);

            legJoints.left.hip.rotation.set(leftGait.hipAngle, 0.0, 0.055);
            legJoints.right.hip.rotation.set(rightGait.hipAngle, 0.0, -0.055);

            legJoints.left.knee.rotation.set(leftGait.kneeAngle, 0, 0);
            legJoints.right.knee.rotation.set(rightGait.kneeAngle, 0, 0);

            legJoints.left.ankle.rotation.set(leftGait.ankleAngle, 0, 0);
            legJoints.right.ankle.rotation.set(rightGait.ankleAngle, 0, 0);

            const maxLegDrop = Math.max(leftGait.verticalDrop, rightGait.verticalDrop);
            const lockOffsetY = (maxLegDrop - BASE_LEG_REACH) + 0.025;

            const phaseRad = gaitPhase * Math.PI * 2;
            const lateralWeightShift = Math.sin(phaseRad);

            ultronRoot.position.set(
                -lateralWeightShift * 0.14 + wholeJitterX,
                lockOffsetY + wholeBobY,
                wholeShiftZ
            );
            ultronRoot.rotation.set(0, 0, lateralWeightShift * 0.032 + wholeRollZ);

            legJoints.left.hip.rotation.z = 0.055 - lateralWeightShift * 0.025;
            legJoints.right.hip.rotation.z = -0.055 - lateralWeightShift * 0.025;

            const strideTwist = (leftGait.hipAngle - rightGait.hipAngle) * 0.22;
            torsoGroup.rotation.y = POSES.walk.torsoRot.y + strideTwist;
            torsoGroup.rotation.x = POSES.walk.torsoRot.x;
            torsoGroup.rotation.z = -lateralWeightShift * 0.022 + wholeRollZ * 0.6;

            headGroup.rotation.y = POSES.walk.headRot.y - strideTwist * 0.65;
            headGroup.rotation.x = POSES.walk.headRot.x;
            headGroup.rotation.z = POSES.walk.headRot.z;

            leftShoulderPivot.rotation.set(
                POSES.walk.leftShoulder.x - leftGait.hipAngle * 0.55,
                POSES.walk.leftShoulder.y,
                POSES.walk.leftShoulder.z
            );
            leftElbowPivot.rotation.set(
                POSES.walk.leftElbow.x - wholeBobY * 0.5,
                POSES.walk.leftElbow.y,
                POSES.walk.leftElbow.z
            );
            leftWristPivot.rotation.copy(POSES.walk.leftWrist);

            rightShoulderPivot.rotation.set(
                POSES.walk.rightShoulder.x - rightGait.hipAngle * 0.30,
                POSES.walk.rightShoulder.y,
                POSES.walk.rightShoulder.z
            );
            rightElbowPivot.rotation.set(
                POSES.walk.rightElbow.x - wholeBobY * 0.5,
                POSES.walk.rightElbow.y,
                POSES.walk.rightElbow.z
            );
            rightWristPivot.rotation.copy(POSES.walk.rightWrist);

            return { leftGait, rightGait, lockOffsetY };
        }

        function getSteppedGaitPhase(elapsedWalkSeconds) {
            const cycleSec = ((elapsedWalkSeconds % FULL_GAIT_CYCLE_SECONDS) + FULL_GAIT_CYCLE_SECONDS) % FULL_GAIT_CYCLE_SECONDS;
            const halfIndex = cycleSec < HALF_CYCLE_DURATION ? 0 : 1;
            const localSec = cycleSec - halfIndex * HALF_CYCLE_DURATION;

            let subPhase;
            let isPaused = false;
            let pauseElapsed = 0;

            if (localSec < STEP_MOVE_DURATION) {
                subPhase = (localSec / STEP_MOVE_DURATION) * 0.5;
            } else {
                subPhase = 0.5;
                isPaused = true;
                pauseElapsed = localSec - STEP_MOVE_DURATION;
            }

            return {
                gaitPhase: halfIndex * 0.5 + subPhase,
                isPaused,
                pauseElapsed
            };
        }

        function applyPoseImmediate() {
            const p = POSES.walk;
            torsoGroup.rotation.copy(p.torsoRot);
            headGroup.rotation.copy(p.headRot);
            leftShoulderPivot.rotation.copy(p.leftShoulder);
            leftElbowPivot.rotation.copy(p.leftElbow);
            leftWristPivot.rotation.copy(p.leftWrist);
            rightShoulderPivot.rotation.copy(p.rightShoulder);
            rightElbowPivot.rotation.copy(p.rightElbow);
            rightWristPivot.rotation.copy(p.rightWrist);

            applyWalkGaitFrame(0, false, 0, 0, 0, 0, 0);

            rightFingerPivots.forEach((fp, i) => {
                const c = p.rightClawCurl + (i * 0.04);
                if (fp.isThumb) {
                    fp.mid.rotation.x = 0.55 * c;
                } else {
                    fp.base.rotation.x = 0.45 * c;
                    fp.mid.rotation.x = 0.78 * c;
                    fp.tip.rotation.x = 0.65 * c;
                }
            });

            leftFingerPivots.forEach((fp, i) => {
                const c = p.leftClawCurl + (i * 0.02);
                if (fp.isThumb) {
                    fp.base.rotation.set(0.75, -0.25, -0.85);
                    fp.mid.rotation.x = 0.82 * c;
                } else {
                    fp.base.rotation.x = 0.88 * c;
                    fp.mid.rotation.x = 0.96 * c;
                    fp.tip.rotation.x = 0.72 * c;
                }
            });
        }
        applyPoseImmediate();
        prepareFootstepArmorWeights();

        // Inicializar la geometría fractal de los rayos de la mano derecha
        handFractalArcs.forEach(arc => rebuildHandFractalArc(arc));

        // ============================================================================
        // 8. ILUMINACIÓN, NUBES, 20,000 GOTAS EN GPU Y RELÁMPAGOS DESDE EL INICIO
        // ============================================================================
        const keyLight = new THREE.DirectionalLight(0xd8ecff, 0.0);
        keyLight.position.set(180, 630, 330);
        keyLight.visible = false;
        scene.add(keyLight);

        const rimLightBlue = new THREE.DirectionalLight(0x407fc2, 0.0);
        rimLightBlue.position.set(-270, 570, -480);
        rimLightBlue.visible = false;
        scene.add(rimLightBlue);

        const chestReactorLight = new THREE.PointLight(0xff3300, 0.0, 435, 1.35);
        chestReactorLight.visible = false;

        // TORMENTA DILUVIANA 100% EN GPU (20,000 gotas animadas en el Vertex Shader con cero costo en CPU)
        const rainSystemGroup = new THREE.Group();

        function createGPURainLayer(count, spanXZ, spanY, minLen, maxLen, minSpeed, maxSpeed, tiltX, tiltZ, colorHex, opacity) {
            const positions = new Float32Array(count * 6);
            const rainSeeds = new Float32Array(count * 8);

            for (let i = 0; i < count; i++) {
                const rx = (Math.random() - 0.5) * spanXZ;
                const ry = Math.random() * spanY;
                const rz = (Math.random() - 0.5) * spanXZ;
                const len = minLen + Math.random() * (maxLen - minLen);
                const spd = minSpeed + Math.random() * (maxSpeed - minSpeed);

                // Vértice superior (offset local 0,0,0) e inferior (inclinación y longitud de la gota)
                positions[i * 6 + 0] = 0;
                positions[i * 6 + 1] = 0;
                positions[i * 6 + 2] = 0;
                positions[i * 6 + 3] = tiltX;
                positions[i * 6 + 4] = -len;
                positions[i * 6 + 5] = tiltZ;

                // Semilla idéntica para ambos vértices del segmento
                rainSeeds[i * 8 + 0] = rx;
                rainSeeds[i * 8 + 1] = ry;
                rainSeeds[i * 8 + 2] = rz;
                rainSeeds[i * 8 + 3] = spd;
                rainSeeds[i * 8 + 4] = rx;
                rainSeeds[i * 8 + 5] = ry;
                rainSeeds[i * 8 + 6] = rz;
                rainSeeds[i * 8 + 7] = spd;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('aRainSeed', new THREE.BufferAttribute(rainSeeds, 4));
            geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 9000);

            const mat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: opacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = rainUniforms.uTime;
                shader.uniforms.uCenterPos = rainUniforms.uCenterPos;
                shader.vertexShader = `
                    uniform float uTime;
                    uniform vec3 uCenterPos;
                    attribute vec4 aRainSeed;
                ` + shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
                    vec3 transformed = position;
                    float spanXZ = ${spanXZ.toFixed(1)};
                    float spanY = ${spanY.toFixed(1)};
                    float wx = uCenterPos.x + mod(aRainSeed.x - uCenterPos.x + spanXZ * 0.5, spanXZ) - spanXZ * 0.5;
                    float wz = uCenterPos.z + mod(aRainSeed.z - uCenterPos.z + spanXZ * 0.5, spanXZ) - spanXZ * 0.5;
                    float wy = uCenterPos.y - 12.0 + mod(aRainSeed.y - uTime * aRainSeed.w, spanY);
                    transformed += vec3(wx, wy, wz);
                    `
                );
            };

            const lines = new THREE.LineSegments(geo, mat);
            lines.frustumCulled = false;
            return lines;
        }

        rainSystemGroup.add(createGPURainLayer(13500, 380.0, 240.0, 2.2, 4.6, 68.0, 102.0, -0.22, 0.08, 0x99bbee, 0.36));

        // CÍRCULOS DE LLUVIA: anillos concéntricos horizontales que crecen en metros

        const rippleCount = 260;

        const rippleGeometry = new THREE.InstancedBufferGeometry();
        rippleGeometry.index = rippleBase.index;
        rippleGeometry.setAttribute('position', rippleBase.getAttribute('position'));
        rippleGeometry.setAttribute('uv', rippleBase.getAttribute('uv'));
        const rippleSeeds = new Float32Array(rippleCount * 4);
        for (let i = 0; i < rippleCount; i++) {
            rippleSeeds[i * 4] = (Math.random() - 0.5) * 100; // x alrededor del jugador
            rippleSeeds[i * 4 + 1] = (Math.random() - 0.5) * 100; // z alrededor del jugador
            rippleSeeds[i * 4 + 2] = Math.random(); // desfase independiente
            rippleSeeds[i * 4 + 3] = 0.68 + Math.random() * 1.25; // velocidad de expansión
        }
        rippleGeometry.setAttribute('aRipple', new THREE.InstancedBufferAttribute(rippleSeeds, 4));
        rippleGeometry.instanceCount = rippleCount;
        const rippleMaterial = new THREE.ShaderMaterial({
            uniforms: { uTime: rainUniforms.uTime, uCenterPos: rainUniforms.uCenterPos },
            vertexShader: `
                uniform float uTime;
                uniform vec3 uCenterPos;
                attribute vec4 aRipple;
                varying vec2 vRippleUV;
                varying float vRippleAge;
                void main() {
                    float age = fract(aRipple.z + uTime * (0.43 + aRipple.w * 0.28));
                    float radiusMeters = mix(0.12, 2.2, pow(age, 0.85));
                    vRippleAge = age;
                    vRippleUV = uv * 2.0 - 1.0;
                    vec3 world = vec3(
                        uCenterPos.x + aRipple.x + position.x * radiusMeters,
                        0.095,
                        uCenterPos.z + aRipple.y + position.y * radiusMeters
                    );
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(world, 1.0);
                }`,
            fragmentShader: `
                varying vec2 vRippleUV;
                varying float vRippleAge;
                void main() {
                    float d = length(vRippleUV);
                    // El radio visible aumenta físicamente con la escala de los vértices.
                    float ring = 1.0 - smoothstep(0.035, 0.11, abs(d - 0.80));
                    float secondary = 1.0 - smoothstep(0.028, 0.105, abs(d - 0.59));
                    float fadeIn = smoothstep(0.0, 0.12, vRippleAge);
                    float fadeOut = 1.0 - smoothstep(0.56, 1.0, vRippleAge);
                    float opacity = (ring * 0.58 + secondary * 0.21) * fadeIn * fadeOut;
                    if (opacity < 0.012 || d > 0.94) discard;
                    gl_FragColor = vec4(0.55, 0.62, 0.68, opacity);
                }`,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            side: THREE.DoubleSide
        });
        const rainSplashes = new THREE.Mesh(rippleGeometry, rippleMaterial);

        // ALGORITMO FRACTAL DE SUBDIVISIÓN DE PUNTO MEDIO PARA RELÁMPAGOS EN LAS NUBES (Geometría compartida)
        const activeCloudLightnings = [];

        const sharedLightningSegGeo = new THREE.CylinderGeometry(0.8, 1.0, 1.0, 5);
        sharedLightningSegGeo.translate(0, 0.5, 0);

        function subdivideLightningPath(startPt, endPt, generations = 5, maxOffset = 42.0) {
            let points = [startPt.clone(), endPt.clone()];
            const mainDir = _v1.subVectors(endPt, startPt).normalize();
            const upRef = Math.abs(mainDir.y) > 0.9 ? _v2.set(1, 0, 0) : _v2.set(0, 1, 0);
            const ortho1 = new THREE.Vector3().crossVectors(mainDir, upRef).normalize();
            const ortho2 = new THREE.Vector3().crossVectors(mainDir, ortho1).normalize();

            let offsetScale = maxOffset;
            for (let g = 0; g < generations; g++) {
                const nextPts = [points[0]];
                for (let i = 0; i < points.length - 1; i++) {
                    const pA = points[i];
                    const pB = points[i + 1];
                    const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
                    const r1 = (Math.random() - 0.5) * 2.0 * offsetScale;
                    const r2 = (Math.random() - 0.5) * 2.0 * offsetScale;
                    mid.addScaledVector(ortho1, r1);
                    mid.addScaledVector(ortho2, r2);
                    nextPts.push(mid, pB);
                }
                points = nextPts;
                offsetScale *= 0.52;
            }
            return points;
        }

        function disposeCloudLightning(cl) {
            // Las geometrías cilíndricas compartidas NO se destruyen.

        function appendLightningSegments(target, pts, radiusStart, radiusEnd) {
            for (let i=0; i<pts.length-1; i++) {

            }
        }

        function triggerCloudLightning() {
            const boltGroup = new THREE.Group();
            const isCloudToCloud = Math.random() < 0.14; // Predominan rayos que CAEN hasta el suelo
            const startX = (Math.random() - 0.5) * 780;
            const startY = 430 + Math.random() * 145;
            const startZ = -180 + (Math.random() - 0.5) * 420;
            const startPt = new THREE.Vector3(startX, startY, startZ);

            const endPt = isCloudToCloud
                ? new THREE.Vector3(startX + (Math.random() < 0.5 ? 1 : -1) * (160 + Math.random() * 220), startY - 35 - Math.random() * 65, startZ + (Math.random() - 0.5) * 160)
                : new THREE.Vector3(startX + (Math.random() - 0.5) * 140, 0.55, startZ + (Math.random() - 0.5) * 140);

            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xe8f4ff,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const boltSegments = [];
            const mainPts = subdivideLightningPath(startPt, endPt, 5, isCloudToCloud ? 34.0 : 50.0);
            appendLightningSegments(boltSegments, mainPts, 1.35, 0.45);

            const mainVec = new THREE.Vector3().subVectors(endPt, startPt);
            for (let b = 0; b < 4; b++) {
                const idx = Math.floor((0.2 + b * 0.18) * (mainPts.length - 1));
                const branchOrigin = mainPts[idx];
                if (!branchOrigin) continue;
                const branchEnd = branchOrigin.clone()
                    .addScaledVector(mainVec, 0.32 + Math.random() * 0.18)
                    .add(new THREE.Vector3((Math.random() - 0.5) * 95, -25 - Math.random() * 40, (Math.random() - 0.5) * 95));
                const branchPts = subdivideLightningPath(branchOrigin, branchEnd, 4, 12.0);
                appendLightningSegments(boltSegments, branchPts, 0.65, 0.12);
            }
            const lightningInstances = new THREE.InstancedMesh(sharedLightningSegGeo, coreMat, boltSegments.length);
            lightningInstances.frustumCulled = false;
            const lightningTransform = new THREE.Object3D();
            boltSegments.forEach((seg, i) => {
                lightningTransform.position.copy(seg.a);
                lightningTransform.lookAt(seg.b);
                lightningTransform.scale.set(seg.r, seg.r, seg.a.distanceTo(seg.b));
                lightningTransform.updateMatrix();
                lightningInstances.setMatrixAt(i, lightningTransform.matrix);
