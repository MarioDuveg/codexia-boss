            lightningInstances.instanceMatrix.needsUpdate = true;
            boltGroup.add(lightningInstances);

            const flashMat = new THREE.SpriteMaterial({

                opacity: 0.85,
                blending: THREE.AdditiveBlending,

            const flashSprite = new THREE.Sprite(flashMat);
            flashSprite.position.copy(startPt).lerp(endPt, 0.35);

            scene.add(boltGroup);

                coreMat,

                age: 0,
                maxAge: 0.38

            sound.playThunder(0.75 + Math.random() * 0.45);

        // Pisadas titánicas: onda anaranjada + segundo anillo de agua sobre el suelo NEGRO.

        // ============================================================================
        // 9. JETPACK BRILLANTE EN EL CENTRO (ÚNICA LUZ EN LA OSCURIDAD INICIAL)

        const jetpackPickupGroup = new THREE.Group();

        // Enjambre guía del Jetpack: partículas GPU en un único draw call.
        // Ondula claramente de lado a lado y en altura, con pulsos hacia el objetivo.
        const GUIDE_PARTICLE_COUNT = 160;
        const guideGeometry = new THREE.BufferGeometry();
        const guideVertices = new Float32Array(GUIDE_PARTICLE_COUNT * 3);
        const guidePhases = new Float32Array(GUIDE_PARTICLE_COUNT);
        const guideOffsets = new Float32Array(GUIDE_PARTICLE_COUNT);
        const guideSizes = new Float32Array(GUIDE_PARTICLE_COUNT);
        for (let i = 0; i < GUIDE_PARTICLE_COUNT; i++) {
            guidePhases[i] = (i + Math.random() * 0.35) / GUIDE_PARTICLE_COUNT;
            guideOffsets[i] = (Math.random() - 0.5) * 1.35;
            guideSizes[i] = 0.75 + Math.random() * 0.65;
        }
        guideGeometry.setAttribute('position', new THREE.BufferAttribute(guideVertices, 3));
        guideGeometry.setAttribute('aPhase', new THREE.BufferAttribute(guidePhases, 1));
        guideGeometry.setAttribute('aOffset', new THREE.BufferAttribute(guideOffsets, 1));
        guideGeometry.setAttribute('aSize', new THREE.BufferAttribute(guideSizes, 1));
        const guideUniforms = {
            uTime: { value: 0 },
            uStart: { value: new THREE.Vector3(0, 1.4, 210) },
            uGoal: { value: new THREE.Vector3(0, 1.8, 24) }
        };
        const guideMaterial = new THREE.ShaderMaterial({
            uniforms: guideUniforms,
            vertexShader: `
                attribute float aPhase;
                attribute float aOffset;
                attribute float aSize;
                uniform float uTime;
                uniform vec3 uStart;
                uniform vec3 uGoal;
                varying float vFade;
                varying vec3 vColor;
                void main() {
                    // Flujo continuo que avanza hacia el jetpack, con una onda
                    // viajera tridimensional perceptible desde el visor VR.
                    float t = fract(aPhase + uTime * 0.125);
                    float fadeIn = smoothstep(0.0, 0.065, t);
                    float fadeOut = 1.0 - smoothstep(0.92, 1.0, t);
                    float envelope = fadeIn * fadeOut;
                    vec3 route = uGoal - uStart;
                    // Dirección lateral perpendicular a la ruta para funcionar
                    // incluso cuando el jugador se aparta de la línea central.
                    vec3 sideways = normalize(vec3(-route.z, 0.0, route.x) + vec3(0.0001, 0.0, 0.0001));
                    float phase = t * 29.0 - uTime * 3.65 + aOffset * 0.38;
                    float amplitude = 1.1 + (1.0 - t) * 1.45;
                    vec3 p = mix(uStart, uGoal, t);
                    p += sideways * (sin(phase) * amplitude * envelope + aOffset * 0.38);
                    p.y += (0.62 + cos(phase) * (0.8 + (1.0 - t) * 0.56)) * envelope;
                    // Destellos viajan a lo largo del enjambre e indican avance.
                    float pulse = pow(max(0.0, cos(t * 35.0 - uTime * 5.3)), 8.0);
                    vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = clamp(130.0 / max(1.0, -mvPosition.z), 3.0, 18.0) * aSize * (1.0 + 0.50 * pulse);
                    vColor = mix(vec3(0.05, 0.95, 1.0), vec3(1.0, 0.72, 0.15), 0.27 + 0.54 * pulse);
                    vFade = envelope * (0.60 + 0.40 * pulse);
                }
            `,
            fragmentShader: `
                varying float vFade;
                varying vec3 vColor;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float radius = length(uv) * 2.0;
                    float core = 1.0 - smoothstep(0.05, 0.30, radius);
                    float halo = exp(-7.0 * radius * radius) * 0.54;
                    float alpha = (core + halo) * vFade;
                    if (alpha < 0.02) discard;
                    gl_FragColor = vec4(vColor, min(alpha, 1.0));
                }
            `,
            transparent: true,
            depthWrite: false,
            depthTest: false,
            blending: THREE.AdditiveBlending
        });
        const jetpackGuideParticles = new THREE.Points(guideGeometry, guideMaterial);

        let smokeCursor=0;
        for (let i=0;i<MAX_SMOKE;i++) {
            smokeDummy.scale.setScalar(0);
            smokeDummy.updateMatrix();

        function spawnSmokeVFX(pos, vel, size, life, fire=false, color=0x1a1d24) {
            const i=smokeCursor;
            smokeCursor=(smokeCursor+1)%MAX_SMOKE;
            const s=smokePool[i];
            s.active=true;
            s.pos.copy(pos);
            s.vel.copy(vel);
            s.size=size;
            s.maxLife=s.life=life;
            s.fire=fire;
            s.baseColor.setHex(color);

        function updateSmokeVFX(dt) {
            // Para billboards en espacio mundo usamos la cámara actual; sin geometría por puff.
            camera.getWorldQuaternion(smokeDummy.quaternion);
            for (let i=0;i<MAX_SMOKE;i++) {
                const p=smokePool[i];
                if (p.active) {
                    p.life-=dt;
                    if (p.life<=0) p.active=false;
                }
                if (p.active) {
                    const t=1-p.life/p.maxLife;
                    p.pos.addScaledVector(p.vel,dt);
                    p.vel.multiplyScalar(Math.exp(-2.2*dt));
                    smokeDummy.position.copy(p.pos);
                    const sz=p.size*(1+t*0.75);
                    smokeDummy.scale.set(sz,sz,1);
                    smokeOpacity.setX(i, Math.max(0, (1-t)*0.70));
                    smokeColorTmp.copy(p.baseColor);
                    if (p.fire) smokeColorTmp.lerp(smokeFadeColor,THREE.MathUtils.smoothstep(t,0.05,0.5));
                    smokeMesh.setColorAt(i,smokeColorTmp);
                } else {
                    smokeDummy.position.set(0,-9999,0);
                    smokeDummy.scale.setScalar(0);
                    smokeOpacity.setX(i,0);
                }
                smokeDummy.updateMatrix();
                smokeMesh.setMatrixAt(i,smokeDummy.matrix);
            }
            smokeMesh.instanceMatrix.needsUpdate=true;
            smokeOpacity.needsUpdate=true;
            if (smokeMesh.instanceColor) smokeMesh.instanceColor.needsUpdate=true;
        }

        function updateTurbineExplosionsAndSmoke(dt) {
            for (let i=activeTurbineExplosions.length-1;i>=0;i--) {
                const ex=activeTurbineExplosions[i];
                ex.age+=dt;
                const t=ex.age/ex.maxAge;
                if (t>=1.0) {
                    ex.domeMat.dispose();
                    ex.ringMat.dispose();
                    scene.remove(ex.group);
                    activeTurbineExplosions.splice(i,1);
                    continue;

                ex.plasmaDome.scale.setScalar(1+t*9.5);
                ex.domeMat.opacity=Math.max(0,1-t*2.8);
                ex.shockwaveRing.scale.setScalar(1+t*14);

        function fireWeapon(ctrl, wpnMesh) {
            if (!wpnMesh || passwordOpen) return;
            const now = clock.getElapsedTime();
            const stateHolder = ctrl ? ctrl.userData : wpnMesh.userData;
            if (stateHolder.nextShot && now < stateHolder.nextShot) return;
            stateHolder.nextShot = now + 0.16;

            const handSide = ctrl && ctrl.userData.handedness ? ctrl.userData.handedness : 'both';
            wpnMesh.userData.recoilZ = 0.042;
            wpnMesh.userData.recoilRotX = 0.14;
            wpnMesh.userData.flashAlpha = 1.0;
            triggerControllerHaptics(handSide, 0.42, 35);

            _rotMatrix.extractRotation(wpnMesh.matrixWorld);
            const direction = new THREE.Vector3(0, 0, -1).applyMatrix4(_rotMatrix).normalize();
            const startPos = _v1;
            wpnMesh.getWorldPosition(startPos);

            if (gameState.isGameOver && gameOverMesh) {
                const ray = new THREE.Raycaster(startPos, direction);
                const hits = ray.intersectObject(gameOverMesh);
                if (hits.length > 0) {
                    // En VR, disparar sobre la línea de estado reintenta el envío fallido.
                    // Cualquier otra zona del panel reinicia la partida.
                    const uvY = hits[0].uv?.y ?? -1;
                    if (gameState.battle.uploadStatus === 'error' && uvY >= 0.17 && uvY <= 0.34) {
                        submitBattleGrade(gameState.battle.result);
                    } else {
                        resetExperience();
                    }
                }
                return;
            }

            if (!gameState.hasJetpack && jetpackPickupGroup.visible && !passwordOpen) {
                _v2.subVectors(jetpackPickupGroup.position, startPos);
                const proj = _v2.dot(direction);
                if (proj > 0 && proj < 8.5) {
                    _v3.copy(startPos).addScaledVector(direction, proj);
                    if (_v3.distanceTo(jetpackPickupGroup.position) < 2.2) {
                        requestJetpackPassword();
                        return;
                    }
                }
            }

            // Jarvis recuerda el joystick al apuntar a las turbinas, una sola vez.
            if (gameState.ultronFullyAwake && !jarvisPlayed.has('switch')) {
                for (const turbine of vulnerableTurbines) {
                    if (turbine.destroyed) continue;
                    turbine.group.getWorldPosition(_turbineWorldPos);
                    const ox = _turbineWorldPos.x - startPos.x;
                    const oy = _turbineWorldPos.y - startPos.y;
                    const oz = _turbineWorldPos.z - startPos.z;
                    const along = ox * direction.x + oy * direction.y + oz * direction.z;
                    const missSq = ox*ox + oy*oy + oz*oz - along*along;
                    if (along > 0 && missSq < 43 * 43) {
                        speakJarvis('switch');
                        break;
                    }
                }
            }
            sound.playPlayerShoot();
            if (gameState.battle.startedMs !== null && !gameState.battle.result) {
                gameState.battle.shotsFired++;
            }
            const type = getCurrentWeaponType();
            const hex = weaponColors[type] || 0x00ff00;

            const bGroup = new THREE.Group();
            bGroup.position.copy(startPos);
            bGroup.add(new THREE.Mesh(sharedBulletLaserGeo, sharedBulletMats[type] || sharedBulletMats.int));
            bGroup.add(new THREE.Mesh(sharedBulletCoreGeo, sharedWhiteBasicMat));

            _v2.copy(startPos).add(direction);
            bGroup.lookAt(_v2);
            scene.add(bGroup);

            playerBullets.push({
                mesh: bGroup,
                vel: direction.multiplyScalar(340.0),
                type: type,
                colorHex: hex,
                damage: 28,
                life: 3.5
            });
        }

        // Lanza la Singularidad de Plasma perseguidora desde delante de la mano derecha de Ultron
        function fireHandSingularityOrb() {
            const originPos = _v1;
            handChargeNode.getWorldPosition(originPos);
            sound.playBossShoot();

            const orbGroup = new THREE.Group();
            orbGroup.position.copy(originPos);

            orbGroup.add(new THREE.Mesh(sharedOrbCoreGeo, sharedWhiteBasicMat));

            const cageMesh = new THREE.Mesh(sharedOrbCageGeo, sharedOrbCageMat);
            orbGroup.add(cageMesh);

            const rings = [];
            for (let r = 0; r < 3; r++) {
                const ring = new THREE.Mesh(sharedOrbRingGeos[r], sharedOrbRingMats[r % 2]);
                orbGroup.add(ring);
                rings.push(ring);
            }

            const halo = new THREE.Sprite(sharedOrbHaloMat);
            halo.scale.set(34, 34, 1);
            orbGroup.add(halo);

            scene.add(orbGroup);

            const playerPos = getPlayerWorldPos();
            const initDir = new THREE.Vector3().subVectors(playerPos, originPos).normalize();

            bossBullets.push({
                mesh: orbGroup,
                cageMesh,
                rings,
                vel: initDir.multiplyScalar(68.0),
                hp: 40,
                life: 9.5
            });
        }

        // ============================================================================
        // 12. MOVIMIENTO DEL JUGADOR Y VUELO DEL JETPACK (MITAD DE VELOCIDAD = 29.0)
        // ============================================================================
        function getPlayerWorldPos() {
            return _playerWorldPos.set(playerDolly.position.x, playerDolly.position.y + 1.7, playerDolly.position.z);
        }

        function updatePlayerAndJetpack(dt, elapsedTime) {
            if (passwordOpen) { sound.setJetpackThrusterActive(false, 0); return; }
            const p = gameState.player;
            if (weaponSwitchCooldown > 0) weaponSwitchCooldown -= dt;

            updateVRGunRecoils(dt);

            if (!gameState.hasJetpack && jetpackPickupGroup.visible) {
                jetpackPickupGroup.rotation.y += dt * 1.8;
                jpHoloRing.rotation.z -= dt * 2.4;
                jetpackPickupGroup.position.y = 1.55 + Math.sin(elapsedTime * 3.2) * 0.22;

                const distToJp = Math.hypot(
                    playerDolly.position.x - jetpackPickupGroup.position.x,
                    playerDolly.position.z - jetpackPickupGroup.position.z
                );
                if (distToJp < 3.0) {
                    requestJetpackPassword();
                }
            }

            let leftGripThrust = false;
            let moveX = 0;
            let moveZ = 0;

            const session = renderer.xr.getSession();
            if (session) {
                for (const source of session.inputSources) {
                    if (!source.gamepad) continue;
                    const axes = source.gamepad.axes;
                    let axX = axes.length >= 4 ? axes[2] : (axes[0] || 0);
                    let axY = axes.length >= 4 ? axes[3] : (axes[1] || 0);
                    if (Math.abs(axX) < 0.15) axX = 0;
                    if (Math.abs(axY) < 0.15) axY = 0;

                    if (source.handedness === 'left') {
                        moveX = axX;
                        moveZ = axY;
                        if (source.gamepad.buttons[1] && source.gamepad.buttons[1].pressed) {
                            leftGripThrust = true;
                        }
                    } else if (source.handedness === 'right') {
                        const stickSwitch = Math.abs(axX) > 0.62;
                        if (stickSwitch && !rightStickWeaponAxisWasActive && weaponSwitchCooldown <= 0) {
                            switchWeapon(axX > 0 ? 1 : -1);
                            weaponSwitchCooldown = 0.25;
                        }
                        rightStickWeaponAxisWasActive = stickSwitch;
                    }
                }
            } else {
                if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
                if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
                if (keys['Space'] || keys['ShiftLeft']) leftGripThrust = true;

                camera.rotation.order = 'YXZ';
                camera.rotation.y = p.yaw;
                camera.rotation.x = p.pitch;
            }

            // Movimiento horizontal libre sin ningún límite circular (en aire o tierra)
            if (moveX !== 0 || moveZ !== 0) {
                camera.getWorldDirection(_fwDir);
                _fwDir.y = 0;
                if (_fwDir.lengthSq() < 0.001) _fwDir.set(0, 0, -1);
                _fwDir.normalize();
                _rtDir.set(-_fwDir.z, 0, _fwDir.x).normalize();

                const airSpeed = !gameState.hasJetpack ? 13.5 : ((playerDolly.position.y > 0.5) ? 44.0 : 22.0);
                playerDolly.position.addScaledVector(_fwDir, -moveZ * airSpeed * dt);
                playerDolly.position.addScaledVector(_rtDir, moveX * airSpeed * dt);
            }

            // Inercia adicional de la descarga; decae sin anular locomoción VR / teclado.
            playerDolly.position.addScaledVector(p.shockImpulse, dt);
            p.shockImpulse.multiplyScalar(Math.exp(-dt * 3.2));

            // Propulsión vertical del Jetpack a la mitad de velocidad (29.0 m/s máx)
            if (gameState.hasJetpack && !gameState.isGameOver && leftGripThrust) {
                p.vel.y = THREE.MathUtils.lerp(p.vel.y, 29.0, dt * 4.5);
                sound.setJetpackThrusterActive(true, THREE.MathUtils.clamp(playerDolly.position.y / 600.0, 0, 1));
                triggerControllerHaptics('left', 0.22, 30);
            } else {
                p.vel.y = Math.max(-34.0, p.vel.y - 24.0 * dt);
                sound.setJetpackThrusterActive(false, 0);
            }

            playerDolly.position.y = Math.min(650.0, playerDolly.position.y + p.vel.y * dt);
            if (playerDolly.position.y <= 0.0) {
                playerDolly.position.y = 0.0;
                p.vel.y = 0.0;
            }

            if (!session && isMouseDownLeft && gameState.isRunning) {
                camera.getWorldPosition(_desktopDummyGun.position);
                camera.getWorldQuaternion(_desktopDummyGun.quaternion);
                _desktopDummyGun.updateMatrixWorld();
                _desktopDummyGun.userData = camera.userData;
                fireWeapon(null, _desktopDummyGun);
            }

            gameState.cameraShake = Math.max(0, gameState.cameraShake - dt * 2.5);
            if (!session) {
                const shakeAmt = gameState.cameraShake * 0.25;
                camera.position.set(
                    (Math.random() - 0.5) * shakeAmt,
                    1.7 + (Math.random() - 0.5) * shakeAmt,
                    0
                );
            }
        }

        // ============================================================================
        // 13. DESPERTAR DE ULTRON, MARCHA COLOSAL Y ANIMACIÓN FINAL DE DERROTA
        // ============================================================================
        let prevLeftFootDown = false;
        let prevRightFootDown = false;

        function updateColossalUltronAndStorm(dt, elapsedTime) {
            const b = gameState.boss;

            // Actualizar uniforms de lluvia en GPU (Cero iteraciones en CPU)
            rainSplashes.visible = true; // ondas desde antes de activar a Ultron
            rainUniforms.uTime.value = elapsedTime;
            rainUniforms.uCenterPos.value.copy(playerDolly.position);

            // La tormenta y sus descargas comienzan ANTES de activar al Mecha.
            let activeLightningFlash = 0;
            nextLightningTimer -= dt;
            if (nextLightningTimer <= 0) {
                nextLightningTimer = 2.3 + Math.random() * 3.6;
                triggerCloudLightning();
            }

            for (let i = activeCloudLightnings.length - 1; i >= 0; i--) {
                const cl = activeCloudLightnings[i];
                cl.age += dt;
                if (cl.age >= cl.maxAge) {
                    disposeCloudLightning(cl);
                    activeCloudLightnings.splice(i, 1);
                    continue;
                }
                const flicker = Math.sin((cl.age / cl.maxAge) * Math.PI) * (0.65 + 0.35 * Math.sin(elapsedTime * 55.0));
                cl.coreMat.opacity = flicker;
                cl.flashSprite.material.opacity = flicker * 0.85;
                activeLightningFlash = Math.max(activeLightningFlash, flicker);
            }
            stormFlashLight.intensity = activeLightningFlash * 4.2;
            stormFlashLight.visible = stormFlashLight.intensity > 0.01;

            // Antes del Jetpack hay tormenta, niebla tenue y relámpagos; Ultron permanece apagado.
            if (!gameState.ultronAwakening) {
                updateCloudLayers(elapsedTime, 0.20, activeLightningFlash);
                bootSweepUniform.value = BOOT_START_Y;
                keyLight.visible = false;
                rimLightBlue.visible = false;
                chestReactorLight.visible = false;
                handPlasmaLight.visible = false;
                bootScannerLight.visible = false;
                return;
            }

            gameState.sequenceTime += dt;

            // FASE 1: ENCENDIDO PROGRESIVO EN LA OSCURIDAD (SIN CAMINAR TODAVÍA)
            if (gameState.sequenceTime <= BOOT_DURATION) {
                const bootProgress = THREE.MathUtils.clamp(gameState.sequenceTime / BOOT_DURATION, 0, 1);
                const easedBoot = THREE.MathUtils.smoothstep(bootProgress, 0.0, 1.0);
                const currentY = THREE.MathUtils.lerp(BOOT_START_Y, BOOT_END_Y, easedBoot);
                bootSweepUniform.value = currentY;

                bootScannerLight.position.set(b.pos.x, Math.max(2, currentY), b.pos.z + 67.5);
                bootScannerLight.intensity = Math.sin(bootProgress * Math.PI) * 7.5;
                bootScannerLight.visible = bootScannerLight.intensity > 0.01;

                keyLight.intensity = 1.35 * easedBoot;
                keyLight.visible = keyLight.intensity > 0.01;
                rimLightBlue.intensity = 2.4 * easedBoot;
                rimLightBlue.visible = rimLightBlue.intensity > 0.01;

                chestReactorLight.position.set(b.pos.x, 390, b.pos.z + 52);
                chestReactorLight.intensity = 4.2 * THREE.MathUtils.smoothstep(currentY, 270, 465);
                chestReactorLight.visible = chestReactorLight.intensity > 0.01;

                handPlasmaLight.position.set(b.pos.x - 67.5, 330, b.pos.z + 67.5);
                handPlasmaLight.intensity = 3.5 * THREE.MathUtils.smoothstep(currentY, 240, 435);
                handPlasmaLight.visible = handPlasmaLight.intensity > 0.01;

                // Activar los halos volumétricos sólo cuando el barrido vertical los alcanza
                ultronVolumetricSprites.forEach(vs => {
                    if (!vs.active) {
                        vs.sprite.visible = false;
                        return;
                    }
                    const worldEstY = (vs.localYEstimate + LOCAL_GROUND_OFFSET_Y) * COLOSSAL_SCALE;
                    const mask = THREE.MathUtils.smoothstep(currentY, worldEstY - 18, worldEstY + 18);
                    vs.mat.opacity = mask * 0.48;
                    vs.sprite.visible = vs.mat.opacity > 0.01;
                });


                updateCloudLayers(elapsedTime, easedBoot, activeLightningFlash);

                animatedTurbines.forEach((rotor, idx) => {
                    rotor.rotation.z -= dt * (3.2 + idx * 0.5) * easedBoot;
                });

                applyWalkGaitFrame(0, false, 0, 0, 0, 0);
                headGroup.rotation.x += (1.0 - easedBoot) * 0.22;
                return;
            }

            // FASE 2: ULTRON 100% ENCENDIDO -> MUESTRA BARRA DE MECHA ULTRON Y EMPIEZA A CAMINAR
            if (!gameState.ultronFullyAwake) {
                gameState.ultronFullyAwake = true;
                bootSweepUniform.value = BOOT_END_Y + 50.0;
                bootScannerLight.intensity = 0.0;
                bootScannerLight.visible = false;
                // El roar ya sonó al despertar; no repetirlo al empezar a caminar.
            }

            updateCloudLayers(elapsedTime, 1.0, activeLightningFlash);

            // FASE 3: CINEMÁTICA DE DERROTA (SE HINCA LENTAMENTE, CAE CON REBOTE PESADO Y SE APAGA)
            if (b.defeatState !== 'NONE') {
                b.defeatTimer += dt;
                handChargeNode.scale.setScalar(0.001);

                if (b.defeatTimer < 6.0) {
                    // Etapa 1 (0.0s a 5.0s): Se hinca lentamente con temblor estructural; (5.0s a 6.0s): Pausa de agonía
                    const kt = smoothStep01(Math.min(1.0, b.defeatTimer / 5.0));
                    const struggleTremor = Math.sin(elapsedTime * 22.0) * 0.014 * (1.0 - kt * 0.5);

                    legJoints.left.hip.rotation.x = THREE.MathUtils.lerp(0.10, -0.92, kt);
                    legJoints.left.knee.rotation.x = THREE.MathUtils.lerp(0.15, 1.72, kt);
                    legJoints.left.ankle.rotation.x = THREE.MathUtils.lerp(-0.10, -0.65, kt);

                    legJoints.right.hip.rotation.x = THREE.MathUtils.lerp(-0.10, -0.68, kt);
                    legJoints.right.knee.rotation.x = THREE.MathUtils.lerp(0.15, 1.55, kt);
                    legJoints.right.ankle.rotation.x = THREE.MathUtils.lerp(-0.10, -0.55, kt);

                    torsoGroup.rotation.x = THREE.MathUtils.lerp(POSES.walk.torsoRot.x, 0.44, kt) + struggleTremor;
                    torsoGroup.rotation.z = struggleTremor * 1.5;
                    headGroup.rotation.x = THREE.MathUtils.lerp(POSES.walk.headRot.x, 0.52, kt);

                    // Los brazos caen pesados y sin fuerza hacia adelante
                    leftShoulderPivot.rotation.x = THREE.MathUtils.lerp(POSES.walk.leftShoulder.x, 0.42, kt);
                    leftElbowPivot.rotation.x = THREE.MathUtils.lerp(POSES.walk.leftElbow.x, -0.18, kt);
                    rightShoulderPivot.rotation.x = THREE.MathUtils.lerp(POSES.walk.rightShoulder.x, 0.36, kt);
                    rightElbowPivot.rotation.x = THREE.MathUtils.lerp(POSES.walk.rightElbow.x, -0.22, kt);

                    ultronRoot.position.y = THREE.MathUtils.lerp(0, -1.24, kt);
                    ultronRoot.rotation.x = THREE.MathUtils.lerp(0, 0.08, kt);

                    if (b.defeatTimer > 4.6 && !b.kneelImpactDone) {
                        b.kneelImpactDone = true;
                        triggerFootStompAtContact('left', 0);
                    }
                } else if (b.defeatTimer < 10.4) {
                    // Etapa 2 (6.0s a 8.4s): Caída acelerada por gravedad; (8.4s a 10.4s): Rebote pesado del coloso
                    const fallDuration = 2.4;
                    const localFallT = b.defeatTimer - 6.0;

                    if (localFallT <= fallDuration) {
                        const ft = THREE.MathUtils.clamp(localFallT / fallDuration, 0, 1);
                        // Curva cúbica de aceleración gravitacional
                        const fallCurve = ft * ft * (0.35 + 0.65 * ft);

                        ultronRoot.rotation.x = THREE.MathUtils.lerp(0.08, 1.50, fallCurve);
                        ultronRoot.position.y = THREE.MathUtils.lerp(-1.24, -3.14, fallCurve);
                        ultronRoot.position.z = THREE.MathUtils.lerp(0, 1.72, fallCurve);

                        torsoGroup.rotation.x = THREE.MathUtils.lerp(0.44, 0.12, fallCurve);
                        headGroup.rotation.x = THREE.MathUtils.lerp(0.52, 0.20, fallCurve);
                    } else {
                        // Impacto principal contra el suelo en t = 8.4s
                        if (!b.collapseImpactDone) {
                            b.collapseImpactDone = true;
                            triggerBodyImpactAtContact(torsoGroup, 1);
                            sound.playTurbineDestroyed();
                            gameState.cameraShake = Math.min(2.2, gameState.cameraShake + 1.35);
                            triggerControllerHaptics('both', 1.0, 420);
                        }

                        // Rebote físico pesado (8.4s a 10.4s): sube por la reacción elástica del chasis y vuelve a caer
                        const bounceElapsed = localFallT - fallDuration;
                        let bounceArc = 0;
                        if (bounceElapsed < 0.95) {
                            // Primer rebote pesado hacia arriba y caída secundaria
                            const bt = bounceElapsed / 0.95;
                            bounceArc = Math.sin(bt * Math.PI) * 0.14;
                        } else if (bounceElapsed < 1.55) {
                            // Segundo impacto al terminar el rebote en bounceElapsed = 0.95s
                            if (!b.bounceImpactDone) {
                                b.bounceImpactDone = true;
                                triggerBodyImpactAtContact(torsoGroup, 0);
                            }
                            // Micro-rebote residual de asentamiento
                            const bt2 = (bounceElapsed - 0.95) / 0.60;
                            bounceArc = Math.sin(bt2 * Math.PI) * 0.032;
                        }

                        ultronRoot.rotation.x = 1.50 - bounceArc * 1.15;
                        ultronRoot.position.y = -3.14 + bounceArc * 2.4;
                        ultronRoot.position.z = 1.72;

                        // Sacudida secundaria en cabeza y brazos durante el rebote
                        headGroup.rotation.x = 0.20 - bounceArc * 1.8;
                        leftShoulderPivot.rotation.z = 0.18 + bounceArc * 1.4;
                        rightShoulderPivot.rotation.z = -0.32 - bounceArc * 1.4;
                    }
                } else {
                    // Etapa 3 (10.4s a 13.8s): Ya inerte en el suelo, se apaga progresivamente con parpadeo final
                    if (!b.powerDownSoundDone) {
                        b.powerDownSoundDone = true;
                        sound.playPowerDownCollapse();
                    }

                    const pt = THREE.MathUtils.clamp((b.defeatTimer - 10.4) / 3.4, 0, 1);
                    const flicker = pt < 0.65 ? (0.85 + 0.15 * Math.sin(elapsedTime * 38.0)) : 1.0;
                    const powerRemain = Math.pow(1.0 - pt, 1.5) * flicker;

                    materials.emissiveCore.emissiveIntensity = 2.2 * powerRemain;
                    materials.emissiveDeep.emissiveIntensity = 1.4 * powerRemain;
                    materials.emissiveHot.emissiveIntensity = 2.8 * powerRemain;
                    chestReactorLight.intensity = 4.2 * powerRemain;
                    chestReactorLight.visible = chestReactorLight.intensity > 0.01;
                    handPlasmaLight.intensity = 3.5 * powerRemain;
                    handPlasmaLight.visible = handPlasmaLight.intensity > 0.01;
                    lightningGroup.visible = powerRemain > 0.18;

                    ultronVolumetricSprites.forEach(vs => {
                        if (vs.active) {
                            vs.mat.opacity = 0.48 * powerRemain;
                            vs.sprite.visible = vs.mat.opacity > 0.01;
                        }
                    });

                    if (pt >= 1.0 && !gameState.isGameOver) {
                        b.defeatState = 'POWERED_OFF';
                        endExperience(true);
                    }
                }
                return;
            }

            // CAMINATA COLOSAL HACIA EL JUGADOR + GIRO SUAVE
            gameState.walkTime += dt;
            const stepped = getSteppedGaitPhase(gameState.walkTime);
            const [stompBobY, stompJitterX, stompShiftZ, stompRollZ] = getFootstepChassisMotion(dt);
            const { leftGait, rightGait } = applyWalkGaitFrame(
                stepped.gaitPhase, stepped.isPaused, stepped.pauseElapsed,
                stompBobY, stompJitterX, stompShiftZ, stompRollZ
            );

            const playerPos = getPlayerWorldPos();
            const toPlayerX = playerPos.x - b.pos.x;
            const toPlayerZ = playerPos.z - b.pos.z;
            const targetYaw = Math.atan2(toPlayerX, toPlayerZ);
            b.facingYaw = THREE.MathUtils.lerp(b.facingYaw, targetYaw, dt * 0.45);
            colossalUltronAnchor.rotation.y = b.facingYaw;

            if (!stepped.isPaused) {
                const walkSpeed = 11.5; // Avance colosal constante
                b.pos.x += Math.sin(b.facingYaw) * walkSpeed * dt;
                b.pos.z += Math.cos(b.facingYaw) * walkSpeed * dt;
                colossalUltronAnchor.position.set(b.pos.x, 0, b.pos.z);
            }

            // Transformación local -> mundo usando el giro real del coloso.
            // Así los círculos aparecen debajo de cada bota aunque el jefe haya girado.
            if (leftGait && leftGait.isImpactFrame && !prevLeftFootDown) {
                triggerFootStompAtContact('left', 0);
            }
            if (rightGait && rightGait.isImpactFrame && !prevRightFootDown) {
                triggerFootStompAtContact('right', 1);
            }
            prevLeftFootDown = leftGait ? leftGait.isImpactFrame : false;
            prevRightFootDown = rightGait ? rightGait.isImpactFrame : false;

            animatedTurbines.forEach((rotor, idx) => {
                if (rotor.userData.destroyed) return;
                rotor.rotation.z -= dt * (3.8 + idx * 0.6);
            });

            // Regenerar continuamente los arcos fractales de la mano derecha (estilo relámpago de nube)
            handFractalArcs.forEach((arc) => {
                arc.timer -= dt;
                if (arc.timer <= 0) {
                    arc.timer = 0.055 + Math.random() * 0.065;
                    rebuildHandFractalArc(arc);
                }
            });

            // ATAQUE DE SINGULARIDAD PERSEGUIDORA CARGADA DELANTE DE SU MANO DERECHA
            b.handAttackTimer -= dt;
            if (b.handAttackState === 'COOLDOWN') {
                handChargeNode.scale.setScalar(0.001);
                if (b.handAttackTimer <= 0) {
                    b.handAttackState = 'CHARGING';
                    b.handAttackTimer = 2.4;
                    // La carga conserva su animación visual; power-beam suena sólo al disparar.
                }
            } else if (b.handAttackState === 'CHARGING') {
                const chargeRatio = THREE.MathUtils.clamp(1.0 - (b.handAttackTimer / 2.4), 0.05, 1.0);
                handChargeNode.scale.setScalar(chargeRatio * 1.35);
                handSingularityShell.rotation.y += dt * 6.0;
                handGyroRings.forEach((r, idx) => {
                    r.rotation.x += dt * (4 + idx * 2);
                    r.rotation.y -= dt * (3 + idx * 2);
                });

                if (b.handAttackTimer <= 0) {
                    fireHandSingularityOrb();
                    b.handAttackState = 'COOLDOWN';
                    b.handAttackTimer = 5.2;
                }
            }

            chestReactorLight.position.set(b.pos.x, 390, b.pos.z + 52);
            handPlasmaLight.position.set(b.pos.x - 67.5, 330, b.pos.z + 67.5);


        }

        // Barrera eléctrica de proximidad alrededor de Ultron, escalada a sus 562.5 m.
        // El daño no es continuo: 2.3 s de cooldown para evitar ataques por fotograma.
        const PROXIMITY_SHOCK_RADIUS = COLOSSAL_SCALE * 2.12; // ~159 m en horizontal
        const PROXIMITY_SHOCK_MAX_Y = COLOSSAL_SCALE * 8.15; // altura total aproximada
        const PROXIMITY_SHOCK_INTERVAL = 2.3;
        const shockDir = new THREE.Vector3();
        function updateUltronProximityShock(elapsedTime) {
            const p = gameState.player;
            const b = gameState.boss;
            if (!gameState.ultronAwakening || gameState.isGameOver || b.defeatState !== 'NONE') return;
            if (elapsedTime - p.lastShockTime < PROXIMITY_SHOCK_INTERVAL) return;
            const dx = playerDolly.position.x - b.pos.x;
            const dz = playerDolly.position.z - b.pos.z;
            const distance = Math.hypot(dx, dz);
            const playerY = playerDolly.position.y + 1.7;
            if (distance > PROXIMITY_SHOCK_RADIUS || playerY > PROXIMITY_SHOCK_MAX_Y) return;

            if (distance > 0.001) shockDir.set(dx / distance, 0, dz / distance);
            else shockDir.set(Math.sin(b.facingYaw), 0, Math.cos(b.facingYaw));
            p.lastShockTime = elapsedTime;
            // Empuje inmediato + velocidad decreciente: separa al jugador incluso si mantiene el stick.
            playerDolly.position.addScaledVector(shockDir, 17.0);
            p.shockImpulse.copy(shockDir).multiplyScalar(116.0);
            p.vel.y = Math.max(p.vel.y, 10.0); // elevación corta de la descarga
            const sparkPos = getPlayerWorldPos().clone().addScaledVector(shockDir, -3.0);
            spawnParticles(sparkPos, 0x9fc8ff, 18, 24, 1.4);
            sound.playCriticalHit();
            setHudFlashMessage('DESCARGA DE ULTRON: -20 HP / RETROCESO', 2.0);
            damagePlayer(20);
        }


        // Aviso al volar cerca de las turbinas y advertencia durante el avance del jefe.
        function updateJarvisCombatCues() {
            if (!gameState.ultronFullyAwake || gameState.isGameOver ||
                gameState.boss.defeatState !== 'NONE') return;
            if (gameState.hasJetpack && playerDolly.position.y > 18 && !jarvisPlayed.has('turbines')) {
                const playerPos = getPlayerWorldPos();
                for (const turbine of vulnerableTurbines) {
                    if (turbine.destroyed) continue;
                    turbine.group.getWorldPosition(_turbineWorldPos);
                    if (playerPos.distanceToSquared(_turbineWorldPos) < 280 * 280) {
                        speakJarvis('turbines');
                        break;
                    }
                }
            }
            if (gameState.walkTime > 12 && !jarvisPlayed.has('hermosillo')) {
                speakJarvis('hermosillo');
            }
        }

        // ============================================================================
        // 14. COMBATE, COLISIONES EN LAS 4 TURBINAS Y PARTÍCULAS
        // ============================================================================
        function damagePlayer(amount) {
            if (!gameState.isRunning || gameState.isGameOver || gameState.battle.result?.won) return;
            const before = gameState.player.hp;
            gameState.player.hp = Math.max(0, before - amount);
            if (gameState.battle.startedMs !== null && !gameState.battle.result) {
                gameState.battle.damageTaken += before - gameState.player.hp;
            }
            gameState.cameraShake = Math.min(1.5, gameState.cameraShake + 0.55);
            triggerControllerHaptics('both', 0.9, 180);

            const overlay = document.getElementById('damage-overlay');
            if (overlay) {
                overlay.style.opacity = '1';
                setTimeout(() => { overlay.style.opacity = '0'; }, 180);
            }

            if (gameState.player.hp <= 0) {
                endExperience(false);
            }
        }

        function updateCombatAndParticles(dt, elapsedTime) {
            const playerWorldPos = getPlayerWorldPos();

            // Balas del jugador contra las 4 turbinas ARC y contra los orbes perseguidores
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const pb = playerBullets[i];
                pb.life -= dt;
                pb.mesh.position.addScaledVector(pb.vel, dt);

                let hit = false;

                // 1. ¿Impactó contra un orbe perseguidor de Ultron?
                for (let j = bossBullets.length - 1; j >= 0; j--) {
                    const bb = bossBullets[j];
                    if (pb.mesh.position.distanceTo(bb.mesh.position) < 9.5) {
                        hit = true;
                        bb.hp -= pb.damage;
                        spawnParticles(pb.mesh.position, pb.colorHex, 10, 22, 1.2);
                        if (bb.hp <= 0) {
                            spawnParticles(bb.mesh.position, 0xff5500, 35, 38, 2.2);
                            scene.remove(bb.mesh);
                            bossBullets.splice(j, 1);
                        }
                        break;
                    }
                }

                // 2. ¿Impactó contra alguna de las 4 turbinas vulnerables de Ultron?
                if (!hit && gameState.ultronFullyAwake && gameState.boss.defeatState === 'NONE') {
                    for (const vt of vulnerableTurbines) {
                        if (vt.destroyed) continue;
                        vt.group.getWorldPosition(_turbineWorldPos);
                        const hitRadius = 21.5; // Radio adaptado a la escala 50.0
                        if (pb.mesh.position.distanceTo(_turbineWorldPos) < hitRadius) {
                            speakJarvis('switch');
                            hit = true;
                            if (pb.type === weaknessByTurbine[vt.type]) {
                                if (gameState.battle.startedMs !== null && !gameState.battle.result) {
                                    gameState.battle.correctHits++;
                                }
                                vt.hp = Math.max(0, vt.hp - pb.damage);
                                sound.playCriticalHit();
                                spawnParticles(pb.mesh.position, vt.colorHex, 22, 34, 1.8);

                                // Actualizar vida global de Mecha Ultron como la suma de las 4 turbinas
                                let totalHp = 0;
                                vulnerableTurbines.forEach(t => totalHp += t.hp);
                                gameState.boss.hp = totalHp;

                                if (vt.hp <= 0 && !vt.destroyed) {
                                    vt.destroyed = true;
                                    vt.rotorGroup.userData.destroyed = true;
                                    vt.glowRingOuter.material = materials.darkJoint;
                                    vt.glowRingInner.material = materials.darkJoint;
                                    vt.centerEye.material = materials.darkJoint;
                                    if (vt.glowSprite) {
                                        vt.glowSprite.visible = false;
                                        ultronVolumetricSprites.forEach(s => {
                                            if (s.sprite === vt.glowSprite) s.active = false;
                                        });
                                    }
                                    triggerTurbineExplosion(_turbineWorldPos, vt.colorHex, vt);

                                    if (vulnerableTurbines.every(t => t.destroyed)) {
                                        gameState.boss.hp = 0;
                                        gameState.boss.defeatState = 'DYING';
                                        gameState.boss.defeatTimer = 0;
                                        finishBattle(true, 'Ultron derrotado'); // Se congela el cronómetro al destruir la 4.ª turbina.
                                    }
                                }
                            } else {
                                if (gameState.battle.startedMs !== null && !gameState.battle.result) {
                                    gameState.battle.wrongHits++;
                                }
                                sound.playArmorRicochet();
                                spawnParticles(pb.mesh.position, 0xffaa00, 8, 16, 1.0);
                            }
                            break;
                        }
                    }
                }

                if (hit || pb.life <= 0) {
                    scene.remove(pb.mesh);
                    playerBullets.splice(i, 1);
                }
            }

            // Actualizar los orbes de singularidad perseguidores de Ultron
            for (let i = bossBullets.length - 1; i >= 0; i--) {
                const bb = bossBullets[i];
                bb.life -= dt;

                _v1.subVectors(playerWorldPos, bb.mesh.position).normalize();
                const currentSpeed = bb.vel.length();
                bb.vel.normalize().lerp(_v1, dt * 1.85).normalize().multiplyScalar(currentSpeed);
                bb.mesh.position.addScaledVector(bb.vel, dt);

                bb.cageMesh.rotation.x += dt * 4.5;
                bb.cageMesh.rotation.y += dt * 5.5;
                bb.rings.forEach((r, idx) => {
                    r.rotation.x += dt * (5 + idx * 2);
                    r.rotation.z -= dt * (4 + idx * 2);
                });

                if (bb.mesh.position.distanceTo(playerWorldPos) < 5.5) {
                    damagePlayer(22);
                    spawnParticles(bb.mesh.position, 0xff4500, 32, 34, 2.0);
                    scene.remove(bb.mesh);
                    bossBullets.splice(i, 1);
                    continue;
                }

                if (bb.life <= 0 || bb.mesh.position.y < 0.5) {
                    spawnParticles(bb.mesh.position, 0xff3300, 20, 24, 1.6);
                    scene.remove(bb.mesh);
                    bossBullets.splice(i, 1);
                }
            }

            updateTurbineExplosionsAndSmoke(dt);

            // Actualizar partículas instanciadas
            let anyUpdated = false;
            for (let i = 0; i < MAX_PARTICLES; i++) {
                const pt = particlePool[i];
                if (!pt.active) continue;
                anyUpdated = true;
                pt.life -= dt;
                if (pt.life <= 0) {
                    pt.active = false;
                    dummyObj.scale.setScalar(0);
                    dummyObj.updateMatrix();
                    sparkInstancedMesh.setMatrixAt(i, dummyObj.matrix);
                    continue;
                }
                pt.vel.y -= 24.0 * dt;
                pt.pos.addScaledVector(pt.vel, dt);
                dummyObj.position.copy(pt.pos);
                dummyObj.scale.setScalar(pt.scale * (pt.life / pt.maxLife));
                dummyObj.updateMatrix();
                sparkInstancedMesh.setMatrixAt(i, dummyObj.matrix);
            }
            if (anyUpdated) sparkInstancedMesh.instanceMatrix.needsUpdate = true;
        }

        // ============================================================================
        // 15. HUD: SÓLO CRONÓMETRO Y VIDA DEL JUGADOR (PC y visores Quest).
        // ============================================================================
        function updateAllHUDs() {
            const player = gameState.player;
            const roundedHp = Math.round(player.hp);
            const timerActive = gameState.battle.startedMs !== null;
            const seconds = timerActive ? Math.ceil(getBattleSecondsLeft()) : -1;
            if (roundedHp === lastHudPlayerHp && seconds === lastHudTimerSecond && timerActive === lastHudTimerActive) return;
            lastHudPlayerHp = roundedHp;
            lastHudTimerSecond = seconds;
            lastHudTimerActive = timerActive;

            const playerBarEl = document.getElementById('player-hp-bar');
            if (playerBarEl) playerBarEl.style.width = `${100 * player.hp / player.maxHp}%`;
            const timerEl = document.getElementById('battle-timer-dom');
            if (timerEl) {
                timerEl.style.display = timerActive ? 'block' : 'none';
                timerEl.textContent = formatBattleClock(seconds);
                timerEl.style.color = seconds <= 30 ? '#ff6b6b' : '#dcf9ff';
            }

            vrHudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
            const cx = hudCanvas.width / 2;
            if (timerActive) {
                vrHudCtx.fillStyle = seconds <= 30 ? '#ff7777' : '#d9faff';
                vrHudCtx.font = 'bold 29px Orbitron, Courier New';
                vrHudCtx.textAlign = 'center';
                vrHudCtx.fillText(formatBattleClock(seconds), cx, 47);
            }
            const barW = 172, barH = 11, barX = cx - barW / 2, barY = timerActive ? 62 : 40;
            vrHudCtx.fillStyle = 'rgba(5,40,20,0.70)';
            vrHudCtx.fillRect(barX, barY, barW, barH);
            vrHudCtx.strokeStyle = '#22c55e';
            vrHudCtx.lineWidth = 2;
            vrHudCtx.strokeRect(barX, barY, barW, barH);
            vrHudCtx.fillStyle = '#22c55e';
            vrHudCtx.fillRect(barX + 1, barY + 1,
                Math.max(0, player.hp / player.maxHp * (barW - 2)), barH - 2);
            vrHudTex.needsUpdate = true;
        }

        // ============================================================================
        // 16. EVENTOS DE TECLADO, RATÓN Y BOTÓN DE INICIO
        // ============================================================================
        function drawGameOverPanel(ctx, result, battle) {
            const saved = battle.uploadStatus === 'saved';
            const status = saved ? `GUARDADO EN CODEXIA: ${battle.savedScore} / 100` : battle.uploadStatus === 'error' ?
                'NO GUARDADO - DISPARA AQUÍ PARA REINTENTAR (O R)' : 'ENVIANDO A CODEXIA...';
            ctx.clearRect(0, 0, 1024, 640);
            ctx.fillStyle = 'rgba(3, 9, 18, 0.95)'; ctx.fillRect(0, 0, 1024, 640);
            ctx.strokeStyle = result.won ? '#28dc90' : '#f87171';
            ctx.lineWidth = 10; ctx.strokeRect(12, 12, 1000, 616);
            ctx.textAlign = 'center';
            ctx.fillStyle = result.won ? '#53ffaa' : '#ff9b9b';
            ctx.font = 'bold 59px Orbitron, Courier New';
            ctx.fillText(result.won ? 'ULTRON DESTRUIDO' : (result.reason === 'Tiempo agotado' ? 'TIEMPO AGOTADO' : 'SISTEMA CAÍDO'), 512, 111);
            ctx.fillStyle = '#d8f6ff';
            ctx.font = 'bold 35px Orbitron, Courier New';
            ctx.fillText(`EQUIPO ${result.team}  ·  BATALLA FINAL`, 512, 182);
            ctx.fillStyle = '#ffe28e';
            ctx.font = 'bold 88px Orbitron, Courier New';
            ctx.fillText(`${result.grade.score} / 100`, 512, 290);
            ctx.fillStyle = '#d1e7ec';
            ctx.font = 'bold 27px Courier New';
            ctx.fillText(`PRECISIÓN ${result.grade.accuracy}%   ·   DAÑO RECIBIDO ${result.grade.damageTaken}`, 512, 364);
            ctx.fillText(`TIEMPO ${formatBattleClock(result.grade.seconds)}   ·   ACIERTOS ${battle.correctHits}/${battle.shotsFired}`, 512, 407);
            ctx.fillStyle = saved ? '#7df4bb' : battle.uploadStatus === 'error' ? '#ff9e9e' : '#9bd7ff';
            ctx.font = 'bold 29px Courier New';
            ctx.fillText(status, 512, 490);
            // Diagnóstico corto en el propio visor: no ocultar que el servidor rechazó la nota.
            if (battle.uploadStatus === 'error') {
                ctx.font = '18px Courier New';
                ctx.fillStyle = '#ffc9c9';
                ctx.fillText(battle.uploadError.slice(0, 74), 512, 521);
            }
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 27px Courier New';
            ctx.fillText('[ DISPARA AQUÍ PARA REINICIAR ]', 512, 565);
        }
        function redrawGameOverPanel() {
            if (!gameOverMesh || !gameOverMesh.userData.endCtx || !gameState.battle.result) return;
            drawGameOverPanel(gameOverMesh.userData.endCtx, gameState.battle.result, gameState.battle);
            gameOverMesh.material.map.needsUpdate = true;
        }
        function endExperience(playerWon, reason = '') {
            if (gameState.isGameOver) return;
            gameState.isGameOver = true;
            sound.stopJetpack();
            stopAwakeningSoundSequence();
            if (playerWon) speakJarvis('victory', true);
            else if (reason !== 'Tiempo agotado') speakJarvis('death', true);
            const result = finishBattle(playerWon, reason);
            if (gameOverMesh) {
                camera.remove(gameOverMesh);
                gameOverMesh.material.map.dispose();
                gameOverMesh.material.dispose();
                gameOverMesh.geometry.dispose();
                gameOverMesh = null;
            }
            const endCanvas = document.createElement('canvas');
            endCanvas.width = 1024;
            endCanvas.height = 640;
            const ctx = endCanvas.getContext('2d');
            drawGameOverPanel(ctx, result, gameState.battle);
            gameOverMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(1.85, 1.15),
                new THREE.MeshBasicMaterial({
                    map: new THREE.CanvasTexture(endCanvas),
                    transparent: true, depthTest: false, depthWrite: false, fog: false
                })
            );
            gameOverMesh.userData.endCtx = ctx;
            gameOverMesh.renderOrder = 1002;
            gameOverMesh.position.set(0, 0, -1.5);
            camera.add(gameOverMesh);
        }

        function resetExperience() {
            sound.stopJetpack();
            stopAwakeningSoundSequence();
            stopJarvisDialogue();
            jarvisQueue.length = 0;
            jarvisPlayed.clear();
            jarvisOpeningStarted = false;
            passwordOpen = false;
            passwordDigits = '';
            passwordError = '';
            passwordMesh.visible = false;
            passwordOverlay.classList.remove('active');
            refreshPasswordUI();
            jetpackGuideParticles.visible = true;
            if (gameOverMesh) {
                camera.remove(gameOverMesh);
                gameOverMesh.material.map.dispose();
                gameOverMesh.material.dispose();
                gameOverMesh.geometry.dispose();
                gameOverMesh = null;
            }
            gameState.isGameOver = false;
            gameState.battle = newBattleRecord();
            currentWeaponIndex = 0; // Reinicia en amarillo.
            updateWeaponMaterial();
            lastHudPlayerHp = -1;
            lastHudTimerSecond = -1;
            lastHudTimerActive = false;
            gameState.hasJetpack = false;
            gameState.ultronAwakening = false;
            gameState.ultronFullyAwake = false;
            gameState.sequenceTime = 0;
            gameState.walkTime = 0;
            gameState.player.hp = 100;
            gameState.player.vel.set(0, 0, 0);
            gameState.player.shockImpulse.set(0, 0, 0);
            gameState.player.lastShockTime = -9999;
            playerDolly.position.set(0, 0, 210);

            gameState.boss.hp = 3600;
            gameState.boss.pos.set(0, 0, -235);
            gameState.boss.facingYaw = 0;
            gameState.boss.defeatState = 'NONE';
            gameState.boss.defeatTimer = 0;
            gameState.boss.kneelImpactDone = false;
            gameState.boss.collapseImpactDone = false;
            gameState.boss.bounceImpactDone = false;
            gameState.boss.powerDownSoundDone = false;

            colossalUltronAnchor.visible = false;
            colossalUltronAnchor.position.set(0, 0, -235);
            colossalUltronAnchor.rotation.set(0, 0, 0);
            ultronRoot.position.set(0, 0, 0);
            ultronRoot.rotation.set(0, 0, 0);
            jetpackPickupGroup.visible = true;
            jpPointLight.visible = true;
            lightningGroup.visible = true;
            rainSplashes.visible = true;
            // Limpiar exclusivamente VFX de la partida anterior.
            persistentSmokePlumes.length = 0;
            clearSmokeVFX();
            activeTurbineExplosions.forEach(ex => {
                ex.domeMat.dispose();ex.ringMat.dispose();scene.remove(ex.group);
            });
            activeTurbineExplosions.length = 0;
            activeCloudLightnings.forEach(disposeCloudLightning);
            activeCloudLightnings.length = 0;
            nextLightningTimer = 0.8;
            prevLeftFootDown = prevRightFootDown = false;
            clearFootstepTremor();
            stompShockwaves.forEach(sw => {
                sw.active = false;
                sw.age = 0;
                sw.mesh.visible = false;
                sw.waterMesh.visible = false;
            });
            contactShadows.forEach(c=>c.mesh.visible=false);

            materials.emissiveCore.emissiveIntensity = 2.2;
            materials.emissiveDeep.emissiveIntensity = 1.4;
            materials.emissiveHot.emissiveIntensity = 2.8;


            vulnerableTurbines.forEach(vt => {
                vt.hp = vt.maxHp;
                vt.destroyed = false;
                vt.rotorGroup.userData.destroyed = false;
                vt.glowRingOuter.material = vt.coreMat;
                vt.glowRingInner.material = vt.hotMat;
                vt.centerEye.material = vt.hotMat;
                if (vt.glowSprite) vt.glowSprite.visible = false;
            });
            ultronVolumetricSprites.forEach(vs => {
                vs.active = true;
                vs.mat.opacity = 0;
                vs.sprite.visible = false;
            });
            colossalCloudLayers.forEach(cl => {
                cl.mat.opacity = 0;
                cl.mesh.visible = false;
            });

            applyPoseImmediate();
            if (renderer.xr.isPresenting) {
                // Permanece en el equipo seleccionado durante la sesión VR.
                gameState.isRunning = true;
                startJarvisWelcomeOnce();
            } else {
                // Al reiniciar en PC se puede cambiar el equipo antes de iniciar otra ronda.
                gameState.isRunning = false;
                gameState.team = null;
                document.body.classList.remove('game-active');
            }
            updateAllHUDs();
        }

        window.addEventListener('keydown', (e) => {
            if (passwordOpen) {
                if (renderer.xr.isPresenting) {
                    if (/^Digit[0-9]$/.test(e.code)) inputJetpackDigit(e.code.slice(-1));
                    else if (e.code === 'Backspace') inputJetpackDigit('BORRAR');
                    else if (e.code === 'Enter') submitJetpackPassword();
                }
                return;
            }
            if (e.code === 'KeyR' && gameState.isGameOver && gameState.battle.uploadStatus === 'error') {
                submitBattleGrade(gameState.battle.result);
                return;
            }
            keys[e.code] = true;
            if (e.code === 'KeyE') switchWeapon(1);
            if (e.code === 'KeyQ') switchWeapon(-1);
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        window.addEventListener('wheel', (e) => {
            if (!gameState.isRunning || passwordOpen) return;
            switchWeapon(e.deltaY > 0 ? 1 : -1);
        });

        window.addEventListener('mousemove', (e) => {
            if (!gameState.isRunning || document.pointerLockElement !== canvas) return;
            const sens = 0.0021;
            gameState.player.yaw -= e.movementX * sens;
            gameState.player.pitch = THREE.MathUtils.clamp(gameState.player.pitch - e.movementY * sens, -Math.PI / 2.1, Math.PI / 2.1);
        });

        window.addEventListener('mousedown', (e) => {
            if (passwordOpen) return;
            if (e.button === 0) {
                isMouseDownLeft = true;
                if (gameState.isGameOver) {
                    resetExperience();
                    return;
                }
                if (document.body.classList.contains('game-active') && !renderer.xr.isPresenting && document.pointerLockElement !== canvas) {
                    canvas.requestPointerLock();
                }
            }
            if (e.button === 2 && gameState.isRunning) {
                switchWeapon(1);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isMouseDownLeft = false;
        });

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        document.getElementById('start-btn').addEventListener('click', () => {
            document.body.classList.add('game-active');
            sound.init();
            lockSelectedTeam();
            gameState.isRunning = true;
            startJarvisWelcomeOnce();
            if (vrButton && !renderer.xr.isPresenting) {
                vrButton.click();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================================
        // 17. BUCLE PRINCIPAL WEBXR (`renderer.setAnimationLoop`)
        // ============================================================================
        const debugVisual = new URLSearchParams(location.search).has('debug');
        let debugEl = null;
        if (debugVisual) {
            debugEl=document.createElement('div');
            Object.assign(debugEl.style, {
                position:'fixed',bottom:'12px',left:'12px',background:'#08111ddd',
                color:'#c6f5ff',font:'12px monospace',padding:'8px',zIndex:'999',
                pointerEvents:'none'
            });
            document.body.appendChild(debugEl);
        }
        let lastDebugRefresh = -Infinity;
        renderer.setAnimationLoop(() => {
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsedTime = clock.getElapsedTime();

            if (gameState.isRunning && !gameState.isGameOver) {
                if (isBattleTimeExpired()) endExperience(false, 'Tiempo agotado');
            }
            if (gameState.isRunning && !gameState.isGameOver) {
                updateFootstepArmorTremor(dt);
                updatePlayerAndJetpack(dt, elapsedTime);
                updateJetpackGuide(elapsedTime);
                passwordMesh.visible = passwordOpen && renderer.xr.isPresenting;
                updateVRPasswordPointer();
                updateJarvisDialogue();

                if (rightController && rightController.userData.isSelecting) fireWeapon(rightController, rightWeaponMesh);
                if (leftController && leftController.userData.isSelecting) fireWeapon(leftController, leftWeaponMesh);

                updateColossalUltronAndStorm(dt, elapsedTime);
                updateStompShockwaves(dt);
                updateUltronProximityShock(elapsedTime);
                updateJarvisCombatCues();
                updateCombatAndParticles(dt, elapsedTime);
                updateAllHUDs();
            }

            if (gameState.isRunning) updateContactShadows();
            renderer.render(scene, camera);
            if (debugEl && elapsedTime - lastDebugRefresh >= 0.75) {
                lastDebugRefresh = elapsedTime;
                const stats = renderer.info.render;
                debugEl.textContent = `${visualProfile.toUpperCase()} | ${stats.calls} draw calls | ${stats.triangles} tris | ${stats.points} points`;
            }
        });
    </script>
